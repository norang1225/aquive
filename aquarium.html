<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AQUIVE — Grand Ocean Tank</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Cinzel:wght@400;600&family=Oxanium:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#042840}
body{font-family:'Raleway',sans-serif;user-select:none}

#wrap{width:100vw;height:100vh;position:relative;overflow:hidden}

/* ── 배경 레이어 ── */
/* 이미지 자체에 패럴랙스 여유분 포함 (4880px 기준) */
#layer-bg-base {
  position:absolute;
  top:0;
  left:-120px;
  width:calc(100% + 240px);
  height:100%;
  vertical-align:top;
  z-index:1;
  display:none;
}

/* volume/caustic: 효과 레이어라 height:auto (비율 유지), top으로 위치 이동 */
#layer-bg-caustic,
#layer-bg-volume {
  position:absolute;
  top:0;
  left:-120px;
  width:calc(100% + 240px);
  height:auto;
  vertical-align:top;
  display:none;
}
#layer-bg-caustic{
  z-index:3;mix-blend-mode:screen;pointer-events:none;
  animation:caustic-sway 4s ease-in-out infinite;
  transform-origin: top center;  /* 위쪽 기준으로 줄어들어 모서리가 안 보임 */
}
#layer-bg-volume {z-index:2;mix-blend-mode:screen;pointer-events:none;opacity:0.7}

/* mid-obj: 중경 오브젝트 - 바닥 위, 물고기 near 아래 */
#layer-mid-obj {
  position:absolute;
  bottom:0;
  left:-120px;
  width:calc(100% + 240px);
  height:auto;
  vertical-align:top;
  z-index:23;
  pointer-events:none;
  display:none;
}

/* far-obj: 원경 오브젝트 - caustic 위, 물고기 far 아래 */
#layer-far-obj {
  position:absolute;
  bottom:0;
  left:-120px;
  width:calc(100% + 240px);
  height:auto;
  vertical-align:top;
  z-index:5;
  pointer-events:none;
  display:none;
}

/* ── 바닥 레이어 (이미지 자체에 여유분 포함) ── */
#layer-floor-base,
#layer-floor-obj {
  position:absolute;
  bottom:0;
  left:-120px;
  width:calc(100% + 240px);
  height:auto;
  display:none;
  pointer-events:none;
  vertical-align:top;
}
#layer-floor-base { z-index:15; }
#layer-floor-obj  { z-index:17; }

/* 대수조: base만 세로로 늘어남 (JS recalcGrandWorld()가 px로 설정)
   volume/caustic/mid-obj는 화면 높이 유지 — 스크롤 시 반복 표시되는 효과용 */
.grand-mode #layer-bg-base {
  height:300%;  /* fallback, JS 로드 후 px로 덮어씌워짐 */
}

@keyframes caustic-sway{
  0%  { transform:scaleX(0.94) scaleY(0.97); opacity:0.7; }
  50% { transform:scaleX(1.06) scaleY(1.03); opacity:1.0; }
  100%{ transform:scaleX(0.94) scaleY(0.97); opacity:0.7; }
}

/* ── 수면 반사 shimmer 이미지 레이어 ── */
#layer-shimmer-img{
  position:absolute;
  top:0; left:-120px;
  width:calc(100% + 240px);
  height:100%;
  z-index:50;pointer-events:none;
  object-fit:cover;
  display:none;
  animation:shimmer-breathe 5s ease-in-out infinite alternate;
}
@keyframes shimmer-breathe{
  from{ opacity:0.3; }
  to  { opacity:0.7; }
}

/* ── 프레임 이미지 레이어 ── */
#layer-frame-img{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:auto;
  z-index:55;pointer-events:none;
  display:none;
}
/* ── 기본 그라디언트 배경 (PNG 없을 때) ── */
#default-bg{
  position:absolute;inset:0;z-index:0;
  background:linear-gradient(180deg,
    #2ab8f0 0%,#18a0e0 10%,#1080c8 28%,
    #0c60a0 55%,#084878 80%,#042840 100%
  );
}
/* 기본 수광 */
#default-caustic{
  position:absolute;inset:0;z-index:0;
  background:radial-gradient(ellipse 70% 55% at 50% -5%,rgba(200,245,255,0.3) 0%,transparent 100%);
  pointer-events:none;
}

/* ── 캔버스 ── */
#cvs-far{position:absolute;inset:0;z-index:10}
#cvs-mid{position:absolute;inset:0;z-index:20}
#cvs-fg {position:absolute;inset:0;z-index:30}

/* ── 수면 ── */
#surface-overlay{
  position:absolute;top:0;left:0;right:0;height:22%;
  z-index:35;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(160,235,255,0.2) 0%,transparent 100%);
}

/* ── 기포 ── */
#bubbles1{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
#bubbles2{position:absolute;inset:0;z-index:38;pointer-events:none;overflow:hidden}
.bub1,.bub2{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,0.2) 0%,rgba(200,240,255,0.06) 55%,transparent 100%);
}

/* ── 수류 캔버스 ── */

/* ── 팝업 ── */
#popup{
  position:fixed;z-index:200;
  background:rgba(0,15,45,0.9);
  border:1px solid rgba(120,210,255,0.2);
  border-radius:12px;padding:18px 22px;max-width:250px;
  color:#c0e8ff;pointer-events:none;
  opacity:0;transform:translateY(8px);
  transition:opacity .25s,transform .25s;
  backdrop-filter:blur(14px);
  box-shadow:0 8px 40px rgba(0,50,140,0.35);
}
#popup.on{opacity:1;transform:translateY(0)}
#popup h3{font-family:'Cinzel',serif;font-size:14px;color:#e8f8ff;margin-bottom:3px;letter-spacing:.07em}
#popup .lat{font-size:11px;color:rgba(150,215,255,0.5);font-style:italic;margin-bottom:10px}
#popup p{font-size:12px;color:rgba(180,230,255,0.75);line-height:1.65}
#popup .badge{display:inline-block;margin-top:10px;font-size:10px;padding:2px 10px;border:1px solid rgba(120,210,255,0.2);border-radius:20px;color:rgba(140,215,255,0.6)}

/* ── HUD (Figma 대수조 85:146, 2560×1440 기준) ──
   --u = 화면 배율. JS가 min(가로/2560, 세로/1440)으로 설정 → 아이맥 27"(CSS 2560×1440)에서 1 = 시안 그대로 */
:root{--u:1;--px:calc(var(--u) * 1px)}
.hud-text{
  position:fixed;top:calc(30 * var(--px));z-index:90;
  font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;
  font-size:max(14px, calc(30 * var(--px)));font-weight:400;line-height:normal;
  color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 6px rgba(0,10,40,.55);   /* 밝은 배경에서도 읽히도록 (시안엔 없음, 어두운 배경에선 거의 안 보임) */
}
#hud-depth{left:calc(31 * var(--px))}
#hud-name {left:50%;transform:translateX(-50%)}
#hud-unlock{right:calc(31 * var(--px))}
#ui-depth{font-variant-numeric:tabular-nums}
#ui-tr{display:none}   /* 코드가 값을 써 넣는 옛 요소 (시안엔 없어서 숨김) */

/* 오른쪽 탭 (지도 / 도감 / 내 정보) */
.hud-tab{
  position:fixed;right:0;z-index:91;width:calc(80 * var(--px));padding:0;border:0;background:none;
  cursor:pointer;transition:filter .2s;-webkit-tap-highlight-color:transparent;
}
.hud-tab svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.hud-tab:hover{filter:brightness(1.4)}
.hud-tab.active svg path{fill:#4BB4FF}
.hud-tab.active:hover{filter:none}   /* 활성 탭은 시안 색(#4BB4FF) 그대로 */   /* 지도가 열려 있는 동안 '지도' 탭 (시안: 하늘색) */
.hud-tab:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.tab-lg{height:calc(300 * var(--px))}
.tab-sm{height:calc(100 * var(--px))}
#map-toggle{top:calc(98 * var(--px))}
#dex-toggle{top:calc(398 * var(--px))}
#me-tab    {top:calc(698 * var(--px))}
.tab-txt{
  position:absolute;left:calc(20 * var(--px));top:calc(60 * var(--px));width:calc(40 * var(--px));
  font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;
  font-size:max(13px, calc(30 * var(--px)));font-weight:400;line-height:1.2;color:#fff;text-align:center;
}

/* 하단 좌우 화살표 (반투명 유리 사각형) */
.nav-arrow{
  position:fixed;bottom:calc(30 * var(--px));z-index:90;
  width:calc(100 * var(--px));height:calc(100 * var(--px));padding:0;border:0;border-radius:25%;
  background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  cursor:pointer;transition:background .2s,opacity .2s;-webkit-tap-highlight-color:transparent;
}
.nav-arrow svg{width:100%;height:100%;display:block}
#nav-prev{left:calc(50% - 250 * var(--px))}
#nav-next{left:calc(50% + 150 * var(--px))}
.nav-arrow:hover{background:rgba(0,0,0,.58)}
.nav-arrow:focus-visible{outline:2px solid #fff;outline-offset:3px}
.nav-arrow:disabled{opacity:.2;cursor:default;pointer-events:none}

/* ── 대수조 세로 스크롤바 ── */
#grand-scrollbar{
  position:fixed;
  right:calc(80 * var(--px) + 24px);   /* 오른쪽 탭 왼쪽에 붙임 */
  top:50%;
  transform:translateY(-50%);
  width:4px;
  height:min(360px, 55vh);
  z-index:91;
  display:none;  /* onTankChanged에서 JS로 토글 */
}

#grand-scroll-track{
  position:absolute;inset:0;
  background:rgba(150,210,255,0.1);
  border-radius:2px;
  border:1px solid rgba(120,190,255,0.15);
}
#grand-scroll-handle{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:12px;
  border-radius:6px;
  background:rgba(160,220,255,0.55);
  border:1px solid rgba(200,240,255,0.4);
  cursor:grab;
  transition:background .15s, width .15s;
  /* 높이는 JS에서 계산 */
}
#grand-scroll-handle:hover,
#grand-scroll-handle.dragging{
  background:rgba(200,235,255,0.8);
  border-color:rgba(230,248,255,0.7);
  width:14px;
  cursor:grabbing;
}
/* 트랙 위아래 끝 표시 */
#grand-scroll-track::before,
#grand-scroll-track::after{
  content:'';
  position:absolute;
  left:50%;transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;
  background:rgba(150,210,255,0.25);
}
#grand-scroll-track::before{ top:-4px; }
#grand-scroll-track::after { bottom:-4px; }

/* ══════════════════════════════════════
   편집 패널
══════════════════════════════════════ */


/* ── 수조 전환 오버레이 ── */
#tank-overlay{
  position:fixed;inset:0;z-index:85;
  background:#000818;
  opacity:0;pointer-events:none;
  transition:opacity 0.35s ease;
}
#tank-overlay.fade-in{opacity:1;pointer-events:all;}

/* ── 잠금 수조 토스트 ── */
#lock-toast{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:130;
  background:rgba(0,10,30,0.9);
  border:1px solid rgba(100,180,255,0.2);
  border-radius:10px;padding:16px 24px;
  text-align:center;
  backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;
  transition:opacity 0.25s;
}
#lock-toast.show{opacity:1}
#lock-toast .lock-icon{font-size:24px;margin-bottom:8px}
#lock-toast .lock-msg{
  font-family:'Oxanium','Noto Sans KR',sans-serif;
  font-size:12px;letter-spacing:.14em;
  color:rgba(180,225,255,0.7);line-height:1.7;
}

/* ═══════════════════════════════════
   건물 지도 (Figma 지도1F / 지도B1F / 지도B2F, 2560×1440 기준)
   - 디자인 좌표 그대로 그리고 --u 배율로 축소/확대. HUD(z 90~91) 아래에 떠서 HUD는 그대로 보인다.
   - 오버레이에는 어두운 막(scrim)이 없다 (시안: 패널 뒤만 블러). 패널 바깥을 누르면 닫힌다.
════════════════════════════════════ */
#map-overlay{position:fixed;inset:0;z-index:80;visibility:hidden}
#map-overlay.open{visibility:visible}
#map-stage{position:absolute;left:50%;top:0;width:2560px;height:1440px;margin-left:-1280px;transform-origin:50% 0;transform:scale(var(--u));pointer-events:none}
#map-stage > *{position:absolute}
#map-panel{background:rgba(52,60,63,.8);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);pointer-events:auto}
.map-tab-shape,.map-decor{display:block;pointer-events:none}
.map-tab{
  width:300px;height:80px;padding:21px 0 0;border:0;background:none;color:#fff;
  font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:30px;font-weight:400;line-height:normal;text-align:center;
  cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent;
}
.map-tab.active{cursor:default}
.map-tab:focus-visible{outline:2px solid #fff;outline-offset:-6px}
.map-room{
  padding:0;border:0;border-radius:25px;background:#fff;color:#000;
  font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:30px;font-weight:400;line-height:normal;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;
  transition:filter .2s;-webkit-tap-highlight-color:transparent;
}
.map-room:hover{filter:brightness(.93)}
.map-room.current{background:#4BB4FF}
.map-room.locked{background:rgba(255,255,255,.5);cursor:default}
.map-room.locked:hover{filter:none}
.map-room:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ══════════════════════════════════════
   도감 (Specimen Codex)
══════════════════════════════════════ */
#dex-overlay{
  position:fixed;inset:0;z-index:120;
  background:rgba(2,10,26,0.78);
  backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
  display:flex;align-items:center;justify-content:center;
  padding:40px 24px;
}
#dex-overlay.open{opacity:1;pointer-events:all}

#dex-panel{
  position:relative;
  width:min(960px, 94vw);
  max-height:88vh;
  background:linear-gradient(165deg, rgba(6,26,52,0.97) 0%, rgba(3,16,36,0.99) 100%);
  border:1px solid rgba(120,200,255,0.22);
  border-radius:18px;
  box-shadow:0 30px 90px rgba(0,10,40,0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
  padding:26px 30px 22px;
  display:flex;flex-direction:column;
  transform:translateY(14px) scale(0.97);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
#dex-overlay.open #dex-panel{transform:translateY(0) scale(1)}

#dex-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;flex-shrink:0}
#dex-title{font-family:'Cinzel',serif;font-size:17px;letter-spacing:.12em;color:rgba(230,245,255,0.92)}
#dex-title .sub{
  display:block;font-family:'Oxanium',sans-serif;font-size:9px;
  letter-spacing:.2em;color:rgba(140,200,255,0.45);margin-top:4px;text-transform:uppercase;
}
#dex-close{
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(120,200,255,0.18);
  color:rgba(180,220,255,0.6);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .2s;flex-shrink:0;
}
#dex-close:hover{background:rgba(255,90,90,0.12);border-color:rgba(255,120,120,0.3);color:rgba(255,180,180,0.85)}

#dex-progress{
  display:flex;align-items:center;gap:12px;margin:16px 0 14px;flex-shrink:0;
}
#dex-progress-bar-wrap{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,0.06);overflow:hidden}
#dex-progress-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,rgba(120,210,255,0.7),rgba(255,210,130,0.85));transition:width .4s ease;width:0%}
#dex-progress-label{
  font-family:'Oxanium',sans-serif;font-size:11px;letter-spacing:.1em;
  color:rgba(200,230,255,0.7);white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

#dex-scroll{
  overflow-y:auto;flex:1;padding-right:6px;margin-right:-6px;
}
#dex-scroll::-webkit-scrollbar{width:5px}
#dex-scroll::-webkit-scrollbar-track{background:transparent}
#dex-scroll::-webkit-scrollbar-thumb{background:rgba(120,180,230,0.18);border-radius:3px}

.dex-section{margin-bottom:22px}
.dex-section-head{
  display:flex;align-items:baseline;gap:10px;margin-bottom:10px;
  padding-bottom:7px;border-bottom:1px solid rgba(120,190,255,0.12);
}
.dex-section-name{
  font-family:'Oxanium','Noto Sans KR',sans-serif;font-size:12px;font-weight:600;
  letter-spacing:.1em;color:rgba(220,240,255,0.85);
}
.dex-section-en{
  font-family:'Oxanium',sans-serif;font-size:9px;letter-spacing:.14em;
  color:rgba(140,200,255,0.4);text-transform:uppercase;
}
.dex-section-count{
  margin-left:auto;font-family:'Oxanium',sans-serif;font-size:10px;
  letter-spacing:.06em;color:rgba(160,210,255,0.4);font-variant-numeric:tabular-nums;
}

.dex-grid{
  display:grid;grid-template-columns:repeat(auto-fill, minmax(124px, 1fr));
  gap:10px;
}
.dex-card{
  position:relative;
  background:rgba(255,255,255,0.025);
  border:1px solid rgba(120,190,255,0.14);
  border-radius:10px;
  padding:12px 8px 10px;
  display:flex;flex-direction:column;align-items:center;
  cursor:pointer;transition:all .2s;
  min-height:118px;
}
.dex-card:hover{
  background:rgba(120,190,255,0.06);
  border-color:rgba(150,210,255,0.32);
  transform:translateY(-2px);
}
.dex-card.found{border-color:rgba(255,205,110,0.22)}
.dex-card.found:hover{border-color:rgba(255,210,120,0.5)}

.dex-thumb-wrap{
  width:84px;height:54px;display:flex;align-items:center;justify-content:center;
  margin-bottom:8px;
}
.dex-thumb{
  max-width:84px;max-height:54px;object-fit:contain;
  transition:filter .25s;
}
.dex-card.unfound .dex-thumb{
  filter:brightness(0) saturate(100%) opacity(0.62);
}
.dex-card.found .dex-thumb{
  filter:none;
}
.dex-card.unfound:hover .dex-thumb{
  filter:brightness(0) saturate(100%) opacity(0.8);
}

.dex-card-name{
  font-family:'Oxanium','Noto Sans KR',sans-serif;font-size:10.5px;font-weight:600;
  letter-spacing:.03em;color:rgba(220,240,255,0.85);text-align:center;
  line-height:1.3;
}
.dex-card.unfound .dex-card-name{color:rgba(150,165,185,0.4)}
.dex-card-name.masked{letter-spacing:.12em}

.dex-card-tag{
  position:absolute;top:6px;right:6px;
  font-size:9px;color:rgba(255,210,130,0.7);
}

#dex-empty{
  text-align:center;padding:60px 20px;
  font-family:'Oxanium','Noto Sans KR',sans-serif;font-size:12px;
  letter-spacing:.1em;color:rgba(160,210,255,0.4);line-height:1.8;
}

@media (max-width:640px){
  #dex-overlay{padding:14px}
  #dex-panel{width:100%;max-height:94vh;padding:18px 14px 14px;border-radius:14px}
  #dex-title{font-size:14px}
  #dex-title .sub{font-size:8px;letter-spacing:.14em}
  .dex-grid{grid-template-columns:repeat(auto-fill, minmax(96px, 1fr));gap:8px}
  .dex-thumb-wrap{width:64px;height:44px}
  .dex-thumb{max-width:64px;max-height:44px}
}
</style>
</head>
<body>
<div id="wrap">

<script src="aquive-store.js"></script>
<script>
// HUD 배율: 디자인(2560×1440) 대비 현재 창 크기 (CSS의 --u)
(function(){
  const set = () => document.documentElement.style.setProperty('--u', Math.min(window.innerWidth/2560, window.innerHeight/1440));
  window.addEventListener('resize', set); set();
})();
</script>
<script>
// ══════════════════════════════════════════
//  티어 배율
// ══════════════════════════════════════════
const TIER_SCALE = {xl:4.0, lg:2.2, sl:1.5, md:0.58, sm:0.32};

// ══════════════════════════════════════════
//  캔버스
// ══════════════════════════════════════════
const farCvs = document.getElementById('cvs-far');
const midCvs = document.getElementById('cvs-mid');
const fgCvs  = document.getElementById('cvs-fg');
const farCtx = farCvs.getContext('2d');
const midCtx = midCvs.getContext('2d');
const fgCtx  = fgCvs.getContext('2d');

// ── Retina(HiDPI) 대응 ──
// 캔버스 물리 픽셀 = 논리 픽셀 × dpr
// ctx는 dpr배로 스케일해서 논리 픽셀 좌표로 그리면 됨
const DPR = window.devicePixelRatio || 1;

function resize(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  [farCvs, midCvs, fgCvs].forEach(c => {
    c.width  = Math.round(vw * DPR);
    c.height = Math.round(vh * DPR);
    c.style.width  = vw + 'px';
    c.style.height = vh + 'px';
  });
  // ctx 스케일 초기화 후 dpr 적용
  [farCtx, midCtx, fgCtx].forEach(ctx => {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  });
}
resize();
window.addEventListener('resize',()=>{resize();rebuildFish();});

// ══════════════════════════════════════════
//  물고기 인스턴스
// ══════════════════════════════════════════
let FISH = [];   // 런타임 인스턴스
let fishData = [];

// 물고기 1건(fd)은 layers 맵({near:n, mid:n, far:n, bot:n})으로 여러 거리에 동시에 배치될 수 있다.
// 구버전 데이터({layer, count})는 자동으로 {layer: count}로 변환한다.
const FISH_LAYER_KEYS = ['near','mid','far','bot'];
function fishLayerMap(fd){
  if(fd.layers && typeof fd.layers === 'object'){
    const m = {};
    FISH_LAYER_KEYS.forEach(k=>{
      const n = parseInt(fd.layers[k]) || 0;
      if(n > 0) m[k] = n;
    });
    if(Object.keys(m).length) return m;
  }
  return { [fd.layer || 'mid']: parseInt(fd.count) || 1 };
}

function buildInstance(fd){
  // fd: {id, name, latin, desc, dep, tier, layers | (layer,count), speed, src}
  const vw = logicalW();
  const vh = logicalH();
  const tierScl = TIER_SCALE[fd.tier]||1;   // 크기(티어)는 등록 1건당 고정
  // 기준 크기: 이미지 원본 비율 유지, 너비 200px 기준
  const baseW = 200;
  const baseH = fd.imgH && fd.imgW ? baseW * (fd.imgH/fd.imgW) : 80;

  const img = new Image();   // 이미지는 모든 거리가 공유
  img.src = fd.src;

  const instances = [];
  Object.entries(fishLayerMap(fd)).forEach(([layer, cnt])=>{
    let depthScl, yMin, yMax, da;
    switch(layer){
      case 'far':  depthScl=0.52; yMin=vh*.05; yMax=vh*.52; da=0.48; break;
      case 'bot':  depthScl=0.82; yMin=vh*.78; yMax=vh*.91; da=0.82; break;
      case 'near': depthScl=1.12; yMin=vh*.08; yMax=vh*.88; da=1.0;  break;
      default:     depthScl=0.9;  yMin=vh*.12; yMax=vh*.78; da=0.78;
    }
    const w = baseW * tierScl * depthScl;
    const h = baseH * tierScl * depthScl;
    for(let i=0;i<cnt;i++){
      instances.push({
        fd, layer, img, w, h, da,      // layer: 인스턴스별 거리
        x: Math.random()*(vw+w*2)-w,
        y: yMin+Math.random()*(yMax-yMin),
        yMin, yMax,
        dir: Math.random()>.5?1:-1,
        t: Math.random()*300,
        phase: Math.random()*Math.PI*2,
        sm: 0.82+Math.random()*.36,
      });
    }
  });
  return instances;
}


// ══════════════════════════════════════════
//  수심 시스템
//  - 방문마다 -10m, 최대 -4000m
//  - localStorage 기반 (로그인 연동 전 임시)
// ══════════════════════════════════════════
const DEPTH_PER_VISIT = 10;
const MAX_DEPTH = 4000;

function getDepthData() {
  try {
    return JSON.parse(localStorage.getItem('aquive_depth') || '{"visits":0,"depth":0}');
  } catch(e) { return {visits:0, depth:0}; }
}
function saveDepthData(obj) {
  try { localStorage.setItem('aquive_depth', JSON.stringify(obj)); } catch(e) {}
}

function recordVisit() {
  const data = getDepthData();
  // 같은 세션 중복 카운트 방지
  const lastVisit = localStorage.getItem('aquive_last_session');
  const sessionKey = Math.floor(Date.now() / (1000 * 60 * 30)).toString(); // 30분 단위 세션
  if(lastVisit !== sessionKey) {
    data.visits = Math.min(data.visits + 1, MAX_DEPTH / DEPTH_PER_VISIT);
    data.depth  = data.visits * DEPTH_PER_VISIT;
    saveDepthData(data);
    localStorage.setItem('aquive_last_session', sessionKey);
    window.AquiveSync?.push();   // 계정 기록 저장 (로그인한 경우에만 동작)
  }
  return data;
}

function renderDepth() {
  const data = getDepthData();
  const depthEl = document.getElementById('ui-depth');
  const visitEl = document.getElementById('ui-visit');
  if(!depthEl) return;

  // 숫자 카운트업 애니메이션
  const target = data.depth;   // 새 HUD: '수심 100m' (양수 표기)
  let current = 0;
  const step = target / 40;
  let frame = 0;
  function countUp() {
    frame++;
    current += step;
    if(frame >= 40) {
      depthEl.textContent = target.toLocaleString();
    } else {
      depthEl.textContent = Math.round(current).toLocaleString();
      requestAnimationFrame(countUp);
    }
  }
  if(data.depth === 0) {
    depthEl.textContent = '0';
  } else {
    requestAnimationFrame(countUp);
  }

  // 방문 횟수 표시
  const remaining = MAX_DEPTH / DEPTH_PER_VISIT - data.visits;
  if(visitEl) {
    if(data.depth >= MAX_DEPTH) {
      visitEl.textContent = '최대 수심 도달 · ―4,000m';
    } else {
      visitEl.textContent = `${data.visits}회 방문 · 다음 방문까지 ―${DEPTH_PER_VISIT}m`;
    }
  }
}

// 방문 기록 + 렌더
recordVisit();
renderDepth();

function rebuildFish(){
  FISH = [];
  fishData.forEach(fd=>{
    FISH.push(...buildInstance(fd));
  });
  const layerOrder={far:0,bot:1,mid:2,near:3};
  FISH.sort((a,b)=>(layerOrder[a.layer]||2)-(layerOrder[b.layer]||2));
  document.getElementById('ui-tr').textContent = FISH.length + ' specimens';
}
rebuildFish();

// ══════════════════════════════════════════
//  팝업
// ══════════════════════════════════════════
const popup = document.getElementById('popup');
let popT;
function showPopup(fd,mx,my){
  document.getElementById('p-name').textContent = fd.name;
  document.getElementById('p-lat').textContent  = fd.latin;
  document.getElementById('p-desc').textContent = fd.desc;
  document.getElementById('p-dep').textContent  = fd.dep;
  const pw=252,ph=172;
  let px=mx+18, py=my-ph/2;
  if(px+pw>window.innerWidth-10) px=mx-pw-18;
  if(py<10) py=10;
  if(py+ph>window.innerHeight-10) py=window.innerHeight-ph-10;
  popup.style.left=px+'px'; popup.style.top=py+'px';
  popup.classList.add('on');
  clearTimeout(popT);
  popT=setTimeout(()=>popup.classList.remove('on'),5500);
  recordSighting(fd.id);
}

[farCvs,midCvs,fgCvs].forEach(cvs=>{
  cvs.addEventListener('click',e=>{
    const mx=e.clientX,my=e.clientY;
    const grand = isGrandTank();
    // 가장 위(near)부터 역순으로 체크
    for(let i=FISH.length-1;i>=0;i--){
      const f=FISH[i];
      // 렌더링과 동일한 오프셋 계산
      let plxXKey = 'fishMid';
      if(f.layer==='far')  plxXKey = 'fishFar';
      if(f.layer==='near') plxXKey = 'fishNear';
      const fishPlxX   = -plx.curX * PLX_BG_MAX_X * PLX[plxXKey];
      const camOffsetY = grand
        ? cam.current * ((f.layer==='far') ? 0.85 : (f.layer==='near') ? 1.0 : 0.92)
        : 0;
      const fx = f.x + fishPlxX;
      const fy = f.y - f.h/2 - camOffsetY;
      const pad = 0.1;
      const hx = fx - f.w * pad;
      const hy = fy - f.h * pad;
      const hw = f.w * (1 + pad * 2);
      const hh = f.h * (1 + pad * 2);
      if(mx>=hx && mx<=hx+hw && my>=hy && my<=hy+hh){
        showPopup(f.fd,mx,my); break;
      }
    }
  });
});


//  패럴랙스 + 대수조 세로 스크롤
// ══════════════════════════════════════════

// 현재 수조 인덱스 (패럴랙스/대수조 판별에 필요해서 여기서 선언)
let currentTankIdx = 0;

// 대수조 월드 높이 배율 (기본값: 이미지 로드 전 fallback)
const GRAND_WORLD_MULT_DEFAULT = 3;
let   grandWorldMult = GRAND_WORLD_MULT_DEFAULT;

// 이미지 실제 비율로 월드 높이 재계산
// base 이미지가 로드되면 호출됨
function recalcGrandWorld(){
  const img = document.getElementById('layer-bg-base');
  if(!img || !img.naturalWidth || !img.naturalHeight) return;

  const containerW = window.innerWidth + 160;
  const containerH = window.innerHeight;

  // base 이미지 전체가 보이도록 필요한 높이
  const neededH = containerW * (img.naturalHeight / img.naturalWidth);
  grandWorldMult = neededH / containerH;

  // base/frame 레이어 전체 높이로 설정
  img.style.height = neededH + 'px';
  const frameEl = document.getElementById('layer-frame-img');
  if(frameEl) frameEl.style.height = neededH + 'px';

  // 카메라를 맨 아래(바닥)로 정확히 맞춤
  if(isGrandTank()){
    const maxScroll = neededH - containerH;
    cam.target  = maxScroll;
    cam.current = maxScroll;
  }

  // 물고기 범위 재배치
  applyGrandFishRange();
}

// 패럴랙스 레이어별 배율 (마우스 중앙 편차 × 이 값 = 이동 픽셀)
const PLX = {
  base:     0.04,
  volume:   0.08,
  caustic:  0.12,
  farobj:   0.18,  // 원경 오브젝트
  midobj:   0.45,  // 중경 오브젝트 (바닥보다 앞이라 더 많이)
  floor:    0.55,
  floorobj: 0.70,
  shimmer:  0.10,
  frame:    0.00,
  fishFar:  0.35,
  fishMid:  0.55,
  fishNear: 0.85,
};

// 현재 패럴랙스 상태 (lerp target)
const plx = { mouseX: 0, mouseY: 0, curX: 0, curY: 0 };
// 대수조 세로 스크롤 카메라 오프셋
const cam = { target: 0, current: 0 };

// 마우스 추적 — X 패럴랙스 (모든 수조): 마우스의 좌우 위치가 배경 이동량이 된다
window.addEventListener('mousemove', e => {
  plx.mouseX = (e.clientX / window.innerWidth - 0.5);  // -0.5 ~ 0.5
});

// ── 대수조 스크롤바 드래그 ──
(function(){
  const bar    = document.getElementById('grand-scrollbar');
  const track  = document.getElementById('grand-scroll-track');
  const handle = document.getElementById('grand-scroll-handle');
  if(!bar || !track || !handle) return;

  let dragging = false;
  let dragStartY = 0;
  let dragStartCamTarget = 0;

  function trackH()  { return track.getBoundingClientRect().height; }
  function handleH() { return handle.getBoundingClientRect().height; }
  function scrollH() { return (grandWorldMult * window.innerHeight) - window.innerHeight; }

  // 핸들 크기: 트랙의 (1/grandWorldMult) 비율
  function updateHandleSize(){
    const th = trackH() || 360;
    handle.style.height = Math.round(th / grandWorldMult) + 'px';
  }

  // 카메라 위치 → 핸들 위치 동기화 (루프에서 매 프레임 호출)
  // 핸들 아래 = 바닥(시작), 핸들 위 = 수면(올라감)
  window.updateScrollHandle = function(){
    if(!isGrandTank()) return;
    updateHandleSize();
    const th = trackH();
    const hh = th / grandWorldMult;
    const travel = th - hh;
    const ratio  = scrollH() > 0 ? cam.current / scrollH() : 1;
    // ratio 반전: cam이 최대(바닥)=1 → 핸들 맨 아래, cam=0(수면) → 핸들 맨 위
    handle.style.top = Math.max(0, Math.min(travel, ratio * travel)) + 'px';
  };

  // 트랙 클릭 → 해당 위치로 즉시 이동
  track.addEventListener('mousedown', e => {
    if(e.target === handle) return;
    const rect  = track.getBoundingClientRect();
    const th    = rect.height;
    const hh    = th / grandWorldMult;
    const ratio = Math.max(0, Math.min(1, (e.clientY - rect.top - hh/2) / (th - hh)));
    cam.target  = ratio * scrollH();
    e.preventDefault();
  });

  // 핸들 드래그 시작
  handle.addEventListener('mousedown', e => {
    dragging = true;
    dragStartY = e.clientY;
    dragStartCamTarget = cam.target;
    handle.classList.add('dragging');
    e.preventDefault();
    e.stopPropagation();
  });

  // 드래그 중
  window.addEventListener('mousemove', e => {
    if(!dragging) return;
    const th     = trackH();
    const hh     = th / grandWorldMult;
    const travel = th - hh;
    const dy     = e.clientY - dragStartY;
    const ratio  = travel > 0 ? dy / travel : 0;
    cam.target   = Math.max(0, Math.min(scrollH(), dragStartCamTarget + ratio * scrollH()));
  });

  // 드래그 종료
  window.addEventListener('mouseup', () => {
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
  });

  // 휠 스크롤도 지원
  document.getElementById('wrap')?.addEventListener('wheel', e => {
    if(!isGrandTank()) return;
    cam.target = Math.max(0, Math.min(scrollH(), cam.target + e.deltaY * 0.8));
    e.preventDefault();
  }, { passive: false });
})();

// 패럴랙스 배경 레이어 업데이트 (CSS transform)
const PLX_BG_MAP = [
  { id: 'layer-bg-base',    key: 'base',     baseLeft: -120 },
  { id: 'layer-bg-volume',  key: 'volume',   baseLeft: -120 },
  { id: 'layer-bg-caustic', key: 'caustic',  baseLeft: -120 },
  { id: 'layer-far-obj',    key: 'farobj',   baseLeft: -120 },
  { id: 'layer-floor-base', key: 'floor',    baseLeft: -120 },
  { id: 'layer-floor-obj',  key: 'floorobj', baseLeft: -120 },
  { id: 'layer-mid-obj',    key: 'midobj',   baseLeft: -120 },
  { id: 'layer-shimmer-img',key: 'shimmer',  baseLeft: -120 },
  // frame은 별도 처리
];
const PLX_BG_MAX_X = 60;   // X 최대 이동 픽셀 (여유분 120px 안에서 ±60px)
const PLX_BG_MAX_Y = 60;   // Y 최대 이동 픽셀 (대수조 세로 스크롤과 별개로 미세 패럴랙스)

function updateParallaxBg(isGrand){
  const dx = plx.curX * PLX_BG_MAX_X;

  PLX_BG_MAP.forEach(({ id, key, baseLeft }) => {
    const el = document.getElementById(id);
    if(!el || el.style.display === 'none') return;
    const scl  = PLX[key] || 0;
    const base = baseLeft ?? -120;

    // X: 패럴랙스 오프셋 (CSS left:-120px 기준에서 추가 이동)
    const offsetX = -dx * scl;

    if(key === 'caustic'){
      // caustic: @keyframes가 transform 사용
      // X → marginLeft, Y → marginTop 으로 우회 (transform 건드리지 않음)
      el.style.marginLeft = offsetX + 'px';
      el.style.marginTop  = isGrand ? (-cam.current + 'px') : '0px';

    } else if(key === 'floor' || key === 'floorobj' || key === 'midobj' || key === 'farobj'){
      // 바닥/중경: X 패럴랙스 + 대수조에서 하단 기준 카메라 오프셋
      if(isGrand){
        const worldH  = window.innerHeight * grandWorldMult;
        const elH     = el.offsetHeight || 0;
        const offsetY = worldH - elH - cam.current;
        el.style.transform = `translateX(${offsetX}px) translateY(${offsetY}px)`;
        el.style.bottom    = 'auto';
        el.style.top       = '0px';
      } else {
        el.style.transform = `translateX(${offsetX}px)`;
        el.style.top       = 'auto';
        el.style.bottom    = '0px';
      }

    } else if(key === 'shimmer'){
      // shimmer: X만, top 고정
      el.style.transform = `translateX(${offsetX}px)`;

    } else {
      // base/volume 등: X + 대수조에서 카메라 오프셋
      const offsetY = isGrand ? -cam.current : 0;
      el.style.transform = `translateX(${offsetX}px) translateY(${offsetY}px)`;
    }
  });
}

// ── 대수조 전용 세팅 ──
function isGrandTank(){ return currentTankIdx === 0; }

function grandWorldH(){
  return window.innerHeight * grandWorldMult;
}

// 대수조에서 물고기 yMin/yMax를 월드 전체로 넓혀 재배치
function applyGrandFishRange(){
  if(!isGrandTank()) return;
  const vh  = logicalH();
  const wh  = grandWorldMult * vh;  // 월드 높이 (논리 픽셀)
  FISH.forEach(f => {
    switch(f.layer){
      case 'far':  f.yMin = wh*.03; f.yMax = wh*.55; break;
      case 'bot':  f.yMin = wh*.78; f.yMax = wh*.94; break;
      case 'near': f.yMin = wh*.05; f.yMax = wh*.90; break;
      default:     f.yMin = wh*.10; f.yMax = wh*.80; break;
    }
    // 현재 y가 새 범위 안에 들어오도록
    f.y = f.yMin + Math.random() * (f.yMax - f.yMin);
  });
}

// 수조 전환 시 호출
function onTankChanged(tankId){
  window.AquiveSync?.noteTank(tankId);   // 마지막으로 본 수조 / 다녀간 수조 기록
  const wrap = document.getElementById('wrap');
  const scrollbar = document.getElementById('grand-scrollbar');

  if(tankId === 0){
    // 대수조: grand-mode + 세로 스크롤바 활성화
    wrap.classList.add('grand-mode');
    if(scrollbar) scrollbar.style.display = 'block';
    applyGrandFishRange();
    // volume/caustic: 대수조에서 height:auto (비율 유지, top으로 이동)
    ['layer-bg-volume','layer-bg-caustic'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.style.height = 'auto';
    });
    const initScrollH = (grandWorldMult * window.innerHeight) - window.innerHeight;
    cam.target  = initScrollH;
    cam.current = initScrollH;
    const handle = document.getElementById('grand-scroll-handle');
    if(handle) handle.style.top = '';
  } else {
    // 다른 수조: grand-mode 해제, 세로 스크롤바 숨김
    wrap.classList.remove('grand-mode');
    if(scrollbar) scrollbar.style.display = 'none';
    // base 높이 초기화
    const base = document.getElementById('layer-bg-base');
    if(base) base.style.height = '';
    // volume/caustic: 일반 수조에서 height:100% (화면 꽉 채움)
    ['layer-bg-volume','layer-bg-caustic'].forEach(id => {
      const el = document.getElementById(id);
      if(el){ el.style.height = '100%'; el.style.top = '0px'; }
    });
    // 모든 배경 레이어 transform 초기화
    PLX_BG_MAP.forEach(({ id, key }) => {
      const el = document.getElementById(id);
      if(!el) return;
      el.style.transform  = 'none';
      el.style.marginLeft = '';
      el.style.marginTop  = '';
      if(key === 'floor' || key === 'floorobj' || key === 'midobj' || key === 'farobj'){
        el.style.top = 'auto'; el.style.bottom = '0px';
      }
    });
    // frame 초기화
    const frameEl2 = document.getElementById('layer-frame-img');
    if(frameEl2){ frameEl2.style.transform = 'none'; frameEl2.style.height = ''; }
    // caustic top 초기화
    const causticEl = document.getElementById('layer-bg-caustic');
    if(causticEl) causticEl.style.transform = 'none';
  }

  // 패럴랙스 X는 수조 전환 시 중앙으로 부드럽게 복귀
  plx.mouseX = 0;
  plx.curX   = 0;
}

//  메인 루프
// ══════════════════════════════════════════
// 논리 픽셀 헬퍼 (캔버스는 DPR 배이므로 나눔)
function logicalW(){ return farCvs.width  / DPR; }
function logicalH(){ return farCvs.height / DPR; }

let t=0;
function loop(){
  const vw = logicalW();
  const vh = logicalH();
  t+=0.016;

  // ── lerp: 마우스 X → 패럴랙스 ──
  const LERP = 0.05;
  plx.curX += (plx.mouseX - plx.curX) * LERP;
  plx.curY += (plx.mouseY - plx.curY) * LERP;

  // ── 대수조: 스크롤바 → 카메라 오프셋 (lerp로 부드럽게) ──
  const grand = isGrandTank();
  if(grand){
    cam.current += (cam.target - cam.current) * LERP;
  }

  // ── 배경 패럴랙스 업데이트 ──
  updateParallaxBg(grand);

  // ── frame: base와 동일하게 카메라 따라감, X만 패럴랙스 ──
  const frameEl = document.getElementById('layer-frame-img');
  if(frameEl && frameEl.style.display !== 'none'){
    const offsetX = -(plx.curX * PLX_BG_MAX_X) * PLX['frame'];
    const offsetY = grand ? -cam.current : 0;
    frameEl.style.transform = `translateX(${offsetX}px) translateY(${offsetY}px)`;
  }

  // ── 스크롤바/슬라이더 핸들 동기화 ──
  if(grand && window.updateScrollHandle) window.updateScrollHandle();

  farCtx.clearRect(0,0,vw,vh);
  midCtx.clearRect(0,0,vw,vh);
  fgCtx.clearRect(0,0,vw,vh);

  FISH.forEach(f=>{
    f.t+=0.016;
    f.x += f.dir*f.fd.speed*f.sm*60*0.016;
    f.y += Math.sin(f.t*.42+f.phase)*.55;
    if(f.y<f.yMin) f.y=f.yMin;
    if(f.y>f.yMax) f.y=f.yMax;
    if(f.x> vw+f.w*2){f.dir=-1; f.x=vw+f.w;}
    if(f.x<-f.w*3)  {f.dir=1;  f.x=-f.w*2;}

    if(!f.img.complete||!f.img.naturalWidth) return;

    const snake=Math.sin(f.t*2.8+f.phase)*.028;
    let tc;
    switch(f.layer){
      case 'far':  tc=farCtx; break;
      case 'near': tc=fgCtx;  break;
      default:     tc=midCtx;
    }

    // ── 패럴랙스 X 오프셋 (물고기 레이어별) ──
    let plxXKey = 'fishMid';
    if(f.layer==='far')  plxXKey = 'fishFar';
    if(f.layer==='near') plxXKey = 'fishNear';
    const fishPlxX = -plx.curX * PLX_BG_MAX_X * PLX[plxXKey];

    // ── 대수조: 세로 카메라 오프셋 (물고기도 카메라와 함께 이동) ──
    // 레이어별 패럴랙스 배율로 살짝 차이
    let camOffsetY = 0;
    if(grand){
      const layerCamScl = (f.layer==='far') ? 0.85
                        : (f.layer==='near') ? 1.0
                        : 0.92;
      camOffsetY = cam.current * layerCamScl;
    }

    tc.save();
    tc.globalAlpha=f.da;
    tc.translate(f.x + fishPlxX, f.y - f.h/2 - camOffsetY);
    if(f.dir===1){tc.translate(f.w,0);tc.scale(-1,1);}
    tc.translate(f.w/2,f.h/2);
    tc.rotate(snake);
    tc.translate(-f.w/2,-f.h/2);
    tc.drawImage(f.img,0,0,f.w,f.h);
    tc.restore();
  });

  requestAnimationFrame(loop);
}
loop();

function getGhUser(){ return 'norang1225'; }

let remoteData = null;

async function loadTanksJson(){
  const user = getGhUser();
  const repo = getGhRepo();
  if(!user || !repo) return null;
  try{
    const url = `https://raw.githubusercontent.com/${user}/${repo}/main/data/tanks.json?t=${Date.now()}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const json = await res.json();
    remoteData = json.tanks || {};
    return remoteData;
  } catch(e){ return null; }
}


function fixImageUrl(url){
  if(!url) return url;
  // jsdelivr → raw로 변환 (jsdelivr 캐시 문제)
  if(url.includes('cdn.jsdelivr.net')){
    return url
      .replace('https://cdn.jsdelivr.net/gh/', 'https://raw.githubusercontent.com/')
      .replace('@main/', '/main/');
  }
  return url;
}

function applyBgFromData(bg){
  console.log('[AQUIVE] applyBgFromData:', JSON.stringify(bg));
  const MAP = {
    'base':     {el:'layer-bg-base',    def:'default-bg'},
    'caustic':  {el:'layer-bg-caustic', def:'default-caustic'},
    'volume':   {el:'layer-bg-volume',  def:null},
    'farobj':   {el:'layer-far-obj',    def:null},
    'midobj':   {el:'layer-mid-obj',    def:null},
    'floor':    {el:'layer-floor-base', def:null},
    'floorobj': {el:'layer-floor-obj',  def:null},
    'shimmer':  {el:'layer-shimmer-img',def:null},
    'frame':    {el:'layer-frame-img',  def:null},
  };
  Object.entries(MAP).forEach(([key, map])=>{
    const el = document.getElementById(map.el);
    if(!el) return;
    const src = fixImageUrl(bg ? bg[key] : null);
    if(src){
      el.src = src;
      el.style.display = 'block';
      if(map.def){ const d=document.getElementById(map.def); if(d) d.style.display='none'; }
      // base 이미지 로드 완료 시 대수조 월드 높이 자동 재계산
      if(key === 'base' && isGrandTank()){
        el.onload = () => recalcGrandWorld();
        if(el.complete && el.naturalWidth) recalcGrandWorld();
      }
    } else {
      el.src = '';
      el.style.display = 'none';
      if(map.def){ const d=document.getElementById(map.def); if(d) d.style.display='block'; }
    }
  });
}

function applyFishFromData(fishArr){
  console.log('[AQUIVE] applyFishFromData:', fishArr?.length, fishArr?.[0]?.src);
  FISH.length = 0;
  if(!fishArr || !fishArr.length) return;
  fishArr = fishArr.map(f => ({...f, src: fixImageUrl(f.src)}));
  fishArr.forEach(fd => { FISH.push(...buildInstance(fd)); });
  const layerOrder = {far:0, bot:1, mid:2, near:3};
  FISH.sort((a,b) => (layerOrder[a.layer]||2)-(layerOrder[b.layer]||2));
  const uiTr = document.getElementById('ui-tr');
  if(uiTr) uiTr.textContent = FISH.length + ' specimens';
}

async function applyTankData(tankId){
  const localKey = 'aquive_tank_data';
  let local = {};
  try{ local = JSON.parse(localStorage.getItem(localKey)||'{}'); } catch(e){}
  const localTank  = local[tankId];
  const remoteTank = remoteData ? remoteData[tankId] : null;
  const bg   = localTank?.bg   || remoteTank?.bg   || {};
  const fish = (localTank?.fish?.length) ? localTank.fish : (remoteTank?.fish || []);
  applyBgFromData(bg);
  applyFishFromData(fish);
  onTankChanged(tankId);
}

function getTank(id){ return TANKS.find(t=>t.id===id); }

let mapCurrentFloor = '1F';

// tankId(TANKS의 id) 기준으로 어느 층 방인지 찾는다 (인덱스 아님). 대수조(0)는 어느 층에도 속하지 않는 특수 케이스.
function tankFloorOf(tankId){
  if(tankId===0) return null;
  for(const floor of Object.keys(MAP_FLOORS)){
    if(MAP_FLOORS[floor].rooms.some(r=>r.id===tankId)) return floor;
  }
  return null;
}

function mk(tag, cls, styles, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(styles) Object.assign(e.style, styles);
  if(html != null) e.innerHTML = html;
  return e;
}
const pxs = n => n + 'px';

function renderMapFloor(floor){
  mapCurrentFloor = floor;
  const F = MAP_FLOORS[floor];
  const stage = document.getElementById('map-stage');
  if(!F || !stage) return;
  stage.innerHTML = '';
  const curId = TANKS[currentTankIdx].id;

  // 폴더 모양 패널 (활성 탭 위치에 따라 모양이 다름)
  const clip = "path('" + F.panel + "')";
  stage.appendChild(mk('div', '', {left:'430px', top:'118px', width:'1700px', height:'1080px', clipPath:clip, webkitClipPath:clip})).id = 'map-panel';

  // 눌리지 않은 탭 모양
  F.tabs.filter(t=>!t.active).forEach(t=>{
    stage.appendChild(mk('div', 'map-tab-shape', {left:pxs(t.x), top:'118px', width:'300px', height:'80px'},
      '<svg width="300" height="80" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="'+MAP_TAB_D+'" fill="#343C3F"/></svg>'));
  });

  // 계단 그림
  F.decor.forEach(d=> stage.appendChild(mk('div', 'map-decor', {left:pxs(d.x), top:pxs(d.y), width:pxs(d.w), height:pxs(d.h)}, d.html)));

  // 방
  F.rooms.forEach(r=>{
    const tank = getTank(r.id);
    const unlocked = isTankUnlocked(tank);
    const current  = (r.id === curId);
    const btn = mk('button', 'map-room' + (current ? ' current' : '') + (!unlocked ? ' locked' : ''),
      {left:pxs(r.x), top:pxs(r.y), width:pxs(r.w), height:pxs(r.h)});
    btn.type = 'button';
    btn.setAttribute('aria-label', tank.name + (current ? ' (현재 위치)' : !unlocked ? ' (잠김)' : ''));
    if(unlocked){
      btn.textContent = tank.name;
    } else {
      // 잠긴 방은 이름 대신 자물쇠 (시안 B2F)
      btn.innerHTML = '<svg width="60" height="66" viewBox="0 0 60 66" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" fill="#000" d="'+MAP_LOCK_D+'"/></svg>';
    }
    btn.addEventListener('click', ()=> selectTankFromMap(r.id));
    stage.appendChild(btn);
  });

  // 층 탭 (글자 + 클릭 영역)
  F.tabs.forEach(t=>{
    const b = mk('button', 'map-tab' + (t.active ? ' active' : ''), {left:pxs(t.cx-150), top:'118px'}, t.floor);
    b.type = 'button';
    b.setAttribute('aria-label', t.floor + ' 지도');
    if(!t.active) b.addEventListener('click', ()=> renderMapFloor(t.floor));
    stage.appendChild(b);
  });
}

function selectTankFromMap(tankId){
  const tank = getTank(tankId);
  if(!isTankUnlocked(tank)){
    showLockToast(tank);
    return;
  }
  closeMap();
  tryNav(TANKS.findIndex(t=>t.id===tankId)); // id → 인덱스 변환
}

function openMap(){
  closeDex();
  renderMapFloor(tankFloorOf(TANKS[currentTankIdx].id) || '1F');
  document.getElementById('map-overlay').classList.add('open');
  document.getElementById('map-toggle')?.classList.add('active');   // 오른쪽 '지도' 탭이 하늘색으로
}
function closeMap(){
  document.getElementById('map-overlay')?.classList.remove('open');
  document.getElementById('map-toggle')?.classList.remove('active');
}

// '지도' 탭은 열기/닫기 토글, 패널 바깥(빈 곳)을 눌러도 닫힘
document.getElementById('map-toggle')?.addEventListener('click', ()=>{
  document.getElementById('map-overlay').classList.contains('open') ? closeMap() : openMap();
});
document.getElementById('map-overlay')?.addEventListener('click', (e)=>{
  if(e.target.id === 'map-overlay') closeMap();
});

// ══════════════════════════════════════════
//  생물 도감 (Specimen Codex)
// ══════════════════════════════════════════
const DEX_KEY = 'aquive_collected_fish';

function getCollectedSet(){
  try{
    const arr = JSON.parse(localStorage.getItem(DEX_KEY) || '[]');
    return new Set(arr);
  } catch(e){ return new Set(); }
}
function saveCollectedSet(set){
  try{ localStorage.setItem(DEX_KEY, JSON.stringify(Array.from(set))); } catch(e){}
}

function recordSighting(fishId){
  if(fishId===undefined || fishId===null) return;
  const set = getCollectedSet();
  const had = set.has(fishId);
  set.add(fishId);
  saveCollectedSet(set);
  if(!had){
    window.AquiveSync?.push();   // 계정 기록 저장
    updateDexBadge();
    if(document.getElementById('dex-overlay')?.classList.contains('open')){
      renderDex();
    }
  }
}

// 전체 수조의 물고기 데이터를 한 번에 모음 (remoteData + localStorage 병합, applyTankData와 동일한 우선순위)
function getAllFishAcrossTanks(){
  const localKey = 'aquive_tank_data';
  let local = {};
  try{ local = JSON.parse(localStorage.getItem(localKey)||'{}'); } catch(e){}

  const groups = [];
  TANKS.forEach(tank=>{
    const localTank  = local[tank.id];
    const remoteTank  = remoteData ? remoteData[tank.id] : null;
    const fishArr = (localTank?.fish?.length) ? localTank.fish : (remoteTank?.fish || []);
    groups.push({
      tank,
      fish: fishArr.map(f => ({...f, src: fixImageUrl(f.src)})),
    });
  });
  return groups;
}

function updateDexBadge(){
  const badge = document.getElementById('dex-badge');
  if(!badge) return;
  const groups = getAllFishAcrossTanks();
  const totalFish = groups.reduce((sum,g)=> sum + g.fish.length, 0);
  const collected = getCollectedSet();
  const foundCount = groups.reduce((sum,g)=> sum + g.fish.filter(f=>collected.has(f.id)).length, 0);
  if(totalFish === 0){
    badge.style.display = 'none';
    return;
  }
  badge.style.display = 'flex';
  badge.textContent = foundCount;
}

function maskName(name){
  // 미발견 종의 이름을 자모 단위로 가려서 '???' 식으로 표시
  return name.replace(/./g, '?');
}

function renderDex(){
  const content = document.getElementById('dex-content');
  const groups = getAllFishAcrossTanks();
  const collected = getCollectedSet();

  let totalFish = 0, totalFound = 0;
  content.innerHTML = '';

  groups.forEach(group=>{
    if(!group.fish.length) return;
    totalFish += group.fish.length;

    const section = document.createElement('div');
    section.className = 'dex-section';

    const foundInSection = group.fish.filter(f=>collected.has(f.id)).length;
    totalFound += foundInSection;

    const head = document.createElement('div');
    head.className = 'dex-section-head';
    head.innerHTML = `
      <span class="dex-section-name">${group.tank.name}</span>
      <span class="dex-section-en">${group.tank.nameEn}</span>
      <span class="dex-section-count">${foundInSection} / ${group.fish.length}</span>
    `;
    section.appendChild(head);

    const grid = document.createElement('div');
    grid.className = 'dex-grid';

    group.fish.forEach(fd=>{
      const found = collected.has(fd.id);
      const card = document.createElement('div');
      card.className = 'dex-card '+(found?'found':'unfound');

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'dex-thumb-wrap';
      const img = document.createElement('img');
      img.className = 'dex-thumb';
      img.src = fd.src;
      img.alt = found ? fd.name : '미확인 개체';
      img.loading = 'lazy';
      thumbWrap.appendChild(img);
      card.appendChild(thumbWrap);

      const nameEl = document.createElement('div');
      nameEl.className = 'dex-card-name'+(found?'':' masked');
      nameEl.textContent = found ? fd.name : maskName(fd.name);
      card.appendChild(nameEl);

      if(found){
        card.addEventListener('click', ()=> showDexDetail(fd, group.tank));
      }

      grid.appendChild(card);
    });

    section.appendChild(grid);
    content.appendChild(section);
  });

  if(totalFish === 0){
    content.innerHTML = '<div id="dex-empty">아직 등록된 생물이 없습니다<br><span style="opacity:.6">수조를 둘러보며 새로운 개체를 만나보세요</span></div>';
  }

  const pct = totalFish ? Math.round((totalFound/totalFish)*100) : 0;
  document.getElementById('dex-progress-bar').style.width = pct+'%';
  document.getElementById('dex-progress-label').textContent = totalFound+' / '+totalFish;
}

function showDexDetail(fd, tank){
  document.getElementById('p-name').textContent = fd.name;
  document.getElementById('p-lat').textContent  = fd.latin;
  document.getElementById('p-desc').textContent = fd.desc;
  document.getElementById('p-dep').textContent  = fd.dep;
  popup.style.left = (window.innerWidth/2 - 126)+'px';
  popup.style.top  = (window.innerHeight/2 - 86)+'px';
  popup.classList.add('on');
  clearTimeout(popT);
  popT = setTimeout(()=>popup.classList.remove('on'), 4500);
}

function openDex(){
  closeMap();
  renderDex();
  document.getElementById('dex-overlay').classList.add('open');
}
function closeDex(){
  document.getElementById('dex-overlay').classList.remove('open');
}

document.getElementById('dex-toggle')?.addEventListener('click', openDex);
document.getElementById('dex-close')?.addEventListener('click', closeDex);
document.getElementById('dex-overlay')?.addEventListener('click', (e)=>{
  if(e.target.id === 'dex-overlay') closeDex();
});

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  if(document.getElementById('dex-overlay')?.classList.contains('open')) closeDex();
  else if(document.getElementById('map-overlay')?.classList.contains('open')) closeMap();
});

updateDexBadge();

function getDepth(){
  try{ return JSON.parse(localStorage.getItem('aquive_depth')||'{"depth":0}').depth; }
  catch(e){ return 0; }
}

function isTankUnlocked(tank){
  const depth = getDepth();
  if(tank.autoUnlock) return depth >= 4000;
  return depth >= Math.abs(tank.unlock);
}

function buildNavDots(){
  const wrap = document.getElementById('tank-nav-dots');
  if(!wrap) return;
  wrap.innerHTML = '';
  TANKS.forEach((tank,i)=>{
    const dot = document.createElement('div');
    dot.className = 'nav-dot'+(i===currentTankIdx?' active':'')+(!isTankUnlocked(tank)?' locked':'');
    dot.title = tank.name;
    dot.addEventListener('click', ()=> tryNav(i));
    wrap.appendChild(dot);
  });
}

function updateNavUI(){
  const tank = TANKS[currentTankIdx];
  const hudName = document.getElementById('hud-name');
  if(hudName) hudName.textContent = tank.name;
  const unlocked = TANKS.filter(t => isTankUnlocked(t)).length;   // 해금된 수조 a/b
  const uc = document.getElementById('hud-unlock-cur'), ut = document.getElementById('hud-unlock-total');
  if(uc) uc.textContent = unlocked;
  if(ut) ut.textContent = TANKS.length;
  const prevBtn = document.getElementById('nav-prev');
  const nextBtn = document.getElementById('nav-next');
  if(prevBtn) prevBtn.disabled = currentTankIdx===0;
  if(nextBtn) nextBtn.disabled = currentTankIdx===TANKS.length-1;
  buildNavDots();
  if(document.getElementById('map-overlay')?.classList.contains('open')){
    renderMapFloor(mapCurrentFloor);
  }
}

function showLockToast(tank){
  const toast = document.getElementById('lock-toast');
  const msg   = document.getElementById('lock-msg');
  if(!toast||!msg) return;
  const needed  = Math.abs(tank.unlock);
  const current = getDepth();
  const diff    = needed-current;
  msg.innerHTML = tank.name+'<br>수심 '+tank.unlock+'m 도달 시 해금<br><span style="color:rgba(120,190,255,0.5);font-size:10px">현재 -'+current+'m · '+diff+'m 더 필요</span>';
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> toast.classList.remove('show'), 2800);
}

function tryNav(idx){
  const tank = TANKS[idx];
  if(!isTankUnlocked(tank)){ showLockToast(tank); return; }
  switchTankWithData(idx);
}

async function switchTankWithData(idx){
  if(idx === currentTankIdx) return;
  const overlay = document.getElementById('tank-overlay');
  if(overlay) overlay.classList.add('fade-in');
  setTimeout(async ()=>{
    currentTankIdx = idx;
    updateNavUI();
    await applyTankData(TANKS[idx].id); // 데이터 키는 인덱스가 아니라 tank id
    if(overlay) overlay.classList.remove('fade-in');
  }, 350);
}

// 화살표 이벤트
document.getElementById('nav-prev')?.addEventListener('click', ()=>{
  if(currentTankIdx > 0) tryNav(currentTankIdx-1);
});
document.getElementById('nav-next')?.addEventListener('click', ()=>{
  if(currentTankIdx < TANKS.length-1) tryNav(currentTankIdx+1);
});

// 초기 로드
(async function(){
  // card.html 의 "이어서" 탭: ?start=continue → 마지막으로 본 수조로 이동
  let resumeId = null;
  if(new URLSearchParams(location.search).get('start') === 'continue'){
    try{ resumeId = (JSON.parse(localStorage.getItem('aquive_progress')||'{}')).lastTankId; }catch(e){}
  }
  await loadTanksJson();
  await applyTankData(0);
  updateNavUI();       // HUD: 수조 이름 / 해금된 수조 수
  updateDexBadge();
  if(Number.isFinite(resumeId)){
    const idx = TANKS.findIndex(t => t.id === resumeId);
    if(idx > 0) tryNav(idx);   // 잠긴 수조면 기존처럼 잠금 안내가 뜸
  }
})();
