<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Noto+Sans+KR:wght@400&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   AQUIVE · 입장 화면 (Figma: 입장-Login, 2560×1440)
   - 디자인 좌표(2560×1440) 그대로 배치하고, 창 크기에 맞춰 비율만 조절(#stage transform)
   - 3D 물고기는 캔버스로 직접 그림 (Figma의 물고기 이미지는 캡처본이라 사용하지 않음)
   ══════════════════════════════════════════ */
:root{ --aquive:#4bb4ff; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;color:#fff}

#stage{position:absolute;left:0;top:0;width:2560px;height:1440px;transform-origin:0 0;background:#000}
#stage > *{position:absolute}

/* 좌상단 타이틀 블록 */
#title  {left:100px;top:99px; width:243px;height:76px;font-size:64px;font-weight:400;line-height:normal;text-align:center}
#sub-en {left:100px;top:175px;width:464px;font-size:32px;font-weight:400;line-height:normal;white-space:nowrap}
#sub-ko {left:100px;top:249px;width:464px;font-size:30px;font-weight:400;line-height:normal;white-space:nowrap}
#desc   {left:100px;top:293px;width:700px;font-size:16px;font-weight:400;line-height:normal;white-space:pre-line}

/* 상단 중앙: 순환 문구 */
#msg{left:0;top:130px;width:2560px;text-align:center;font-size:30px;font-weight:400;line-height:normal;white-space:nowrap;
     opacity:0;transition:opacity .8s ease}
#msg.on{opacity:1}

/* 중앙: 3D 물고기 (중심 = 1280, 705) */
#fish{left:800px;top:445px;width:960px;height:520px;pointer-events:none}

/* Connect 버튼 */
#connect{left:1130px;top:967px;width:300px;height:100px;border-radius:25px;background:var(--aquive);color:#fff;
         font-family:'Inter',sans-serif;font-size:32px;font-weight:400;text-decoration:none;
         display:flex;align-items:center;justify-content:center;transition:filter .2s,transform .1s}
#connect:hover{filter:brightness(1.1)}
#connect:active{transform:scale(.98)}
#connect:focus-visible{outline:3px solid #fff;outline-offset:4px}

/* 하단 캡션 (물고기 학명 · 이름) */
#caption{left:0;top:1146px;width:2560px;text-align:center;
         font-family:'Courier New',monospace;font-size:16.7px;letter-spacing:.2em;text-transform:uppercase;
         color:rgba(100,190,255,0.35);white-space:pre}

@media (prefers-reduced-motion:reduce){ #msg{transition:none} }
/* ── 입장 연출: Connect → 숫자가 사방으로 퍼지며 밝아짐 ── */
#burst{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:20;display:none}
#flash{position:fixed;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
#stage.leaving #title,#stage.leaving #sub-en,#stage.leaving #sub-ko,#stage.leaving #desc,
#stage.leaving #msg,#stage.leaving #connect,#stage.leaving #caption{opacity:0;transition:opacity .4s ease;pointer-events:none}
</style>

const MSGS = [

  '물고기의 종류는 주기적으로 추가됩니다.',

const MSG_HOLD = 3400;   // 문구가 완전히 보이는 시간(ms)
const MSG_FADE = 800;    // 페이드 인/아웃(ms) — CSS transition과 맞춤

// ── 화면 비율 맞춤 (디자인 2560×1440) ──
const DW = 2560, DH = 1440;
const stage = document.getElementById('stage');
const cvs   = document.getElementById('fish');
const ctx   = cvs.getContext('2d');
const CW = 960, CH = 520;          // 캔버스 디자인 크기
let SCALE = 1, OX = 0, OY = 0;     // 화면 배율 / 디자인 원점의 화면 위치(가운데 정렬 여백)
function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  SCALE = Math.min(vw / DW, vh / DH);
  OX = (vw - DW*SCALE)/2; OY = (vh - DH*SCALE)/2;
  stage.style.transform = 'translate(' + OX + 'px,' + OY + 'px) scale(' + SCALE + ')';
  // 스케일·DPR에 맞는 실제 해상도 (Retina에서도 선명하게)
  const dpr = window.devicePixelRatio || 1;
  cvs.width  = Math.round(CW * SCALE * dpr);
  cvs.height = Math.round(CH * SCALE * dpr);
  ctx.setTransform(SCALE*dpr, 0, 0, SCALE*dpr, 0, 0);
}
window.addEventListener('resize', fit);
fit();

// ── 접속마다 다른 물고기 (직전에 본 물고기는 제외) ──
function pickFish(){
  let last = -1;
  try{ last = parseInt(localStorage.getItem('aquive_last_fish')); }catch(e){}
  if(isNaN(last)) last = -1;
  let i;
  do{ i = Math.floor(Math.random()*FISH.length); }while(i === last && FISH.length > 1);
  try{ localStorage.setItem('aquive_last_fish', String(i)); }catch(e){}
  return i;
}
const fish = FISH[pickFish()];

function decode(b64, n){
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  const dv = new DataView(u8.buffer), out = new Float32Array(n*6);
  for(let i=0;i<n;i++){
    for(let k=0;k<3;k++) out[i*6+k] = dv.getInt16((i*3+k)*2, true) / 10000;
    let nx = dv.getInt8(n*6 + i*3),   ny = dv.getInt8(n*6 + i*3 + 1), nz = dv.getInt8(n*6 + i*3 + 2);
    const l = Math.hypot(nx,ny,nz) || 1;
    out[i*6+3] = nx/l; out[i*6+4] = ny/l; out[i*6+5] = nz/l;
  }
  return out;
}
const FD = decode(fish.b64, fish.n);
const N  = fish.n;

document.getElementById('caption').textContent =
  fish.latin ? fish.latin + '  ·  ' + fish.common : fish.common;

//  포인트클라우드 렌더링 (aquive_fish_3d_v6 기반)
// ══════════════════════════════════════════
const S  = 340;            // 1 단위 = 340px (Figma 물고기 크기에 맞춤)
const K  = S / 200;        // v6(200px 기준) 대비 글자 크기 배율
const CX = CW/2, CY = CH/2;
const D  = '0123456789';
const rc = () => D[Math.floor(Math.random()*10)];
const ri = (a,b) => Math.floor(Math.random()*(b-a))+a;
const cl = (v,a,b) => Math.max(a,Math.min(b,v));

const chars = Array.from({length:N}, rc);
const tm = new Uint8Array(N);
const iv = Array.from({length:N}, () => ri(18,55));
const LX=-0.4, LY=0.5, LZ=0.7, LL=Math.sqrt(LX*LX+LY*LY+LZ*LZ);
const FONTS = [];
for(let s=5;s<=12;s++) FONTS[s] = 'bold ' + (s*K).toFixed(1) + "px 'Courier New',monospace";

// 마우스 → 목표 회전각 (최대 ±25도)
const MAX = 0.44;
let tX=0, tY=0, cX=0, cY=0;
window.addEventListener('pointermove', e => {
  tY =  (e.clientX/window.innerWidth  - 0.5) * MAX * 2;   // 좌우 → Y축 회전
  tX = -(e.clientY/window.innerHeight - 0.5) * MAX;       // 상하 → X축 회전
});

const sx = new Float32Array(N), sy = new Float32Array(N), sz = new Float32Array(N);
const lt = new Float32Array(N), rm = new Float32Array(N);
const order = Array.from({length:N}, (_,i) => i);

function draw(){
  cX += (tX-cX)*0.05;
  cY += (tY-cY)*0.05;
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,CW,CH);

  const cosY=Math.cos(cY), sinY=Math.sin(cY), cosX=Math.cos(cX), sinX=Math.sin(cX);
  for(let i=0;i<N;i++){ tm[i]++; if(tm[i]>=iv[i]){ tm[i]=0; chars[i]=rc(); iv[i]=ri(18,55); } }

  for(let i=0;i<N;i++){
    const o=i*6;
    const px=FD[o], py=FD[o+1], pz=FD[o+2], nx=FD[o+3], ny=FD[o+4], nz=FD[o+5];
    const rx =  px*cosY + pz*sinY,  rz  = -px*sinY + pz*cosY;
    const ry2 = py*cosX - rz*sinX,  rz2 =  py*sinX + rz*cosX;
    const lx =  nx*cosY + nz*sinY,  lz0 = -nx*sinY + nz*cosY;
    const ly2 = ny*cosX - lz0*sinX, lz2 =  ny*sinX + lz0*cosX;
    lt[i] = cl((lx*LX + ly2*LY + lz2*LZ)/LL, 0.05, 1);
    rm[i] = Math.pow(1 - Math.abs(lz2), 3);
    sx[i] = CX + rx*S;  sy[i] = CY - ry2*S;  sz[i] = rz2;
  }
  order.sort((a,b) => sz[a]-sz[b]);   // 뒤 → 앞

  ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  for(let n=0;n<N;n++){
    const i = order[n], l = lt[i], rim = rm[i];
    const spec = Math.max(0, l-0.6)*2.5;
    const br = 0.45 + rim*0.55;
    const alpha = cl(0.35 + br*0.65, 0, 1);
    const size = cl(Math.round(5 + br*7), 5, 12);
    const rb = cl(Math.round(60 + rim*180 + spec*80), 0, 255);
    const gb = cl(Math.round(140 + rim*100 + l*60 + spec*30), 0, 255);
    ctx.font = FONTS[size];
    ctx.fillStyle = 'rgba('+rb+','+gb+',255,'+alpha+')';
    ctx.fillText(chars[i], sx[i], sy[i]);
  }
  requestAnimationFrame(draw);
}
draw();

// ══════════════════════════════════════════
//  순환 문구 (페이드 인/아웃)
// ══════════════════════════════════════════
const msgEl = document.getElementById('msg');
let mi = 0;
function showMsg(){ msgEl.textContent = MSGS[mi]; msgEl.classList.add('on'); }
requestAnimationFrame(() => requestAnimationFrame(showMsg));   // 첫 문구 페이드 인
setInterval(() => {
  msgEl.classList.remove('on');
  setTimeout(() => { mi = (mi+1) % MSGS.length; showMsg(); }, MSG_FADE);
}, MSG_HOLD + MSG_FADE*2);

// ══════════════════════════════════════════
//  입장 연출: Connect → 물고기의 숫자들이 사방으로 퍼지며 밝아지고, 화면이 하얗게 밝아진 뒤 다음 화면으로
//  · 눌러도 안 넘어갈 때를 대비해 시간이 지나면 자동으로 이동, 연출 도중 다시 누르면 바로 이동
//  · 시스템 '동작 줄이기'를 켠 경우에는 연출 없이 바로 이동
// ══════════════════════════════════════════
const NEXT_URL = 'card.html';
const BURST_MS = 1250;                 // 연출 길이(ms)
const EXTRA_PER_DIGIT = 2;             // 물고기 숫자 1개당 추가로 흩뿌릴 숫자 수 (화면을 더 채움)
const burstCv = document.getElementById('burst'), bctx = burstCv.getContext('2d'), flashEl = document.getElementById('flash');
let leaving = false, going = false, particles = [], burstRaf = 0;
const reduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// 지금 화면의 물고기 숫자들을 그대로 입자로 옮긴다 (첫 프레임이 물고기와 똑같아 끊김이 없음)
function buildParticles(){
  const P = [], cx = 800 + CX, cy = 445 + CY;                 // 물고기 중심 (디자인 좌표)
  for(let n=0;n<N;n++){
    const i = order[n], l = lt[i], rim = rm[i];
    const spec = Math.max(0, l-0.6)*2.5, br = 0.45 + rim*0.55;
    const base = {
      x: 800 + sx[i], y: 445 + sy[i],
      size: cl(Math.round(5 + br*7), 5, 12),
      r: cl(Math.round(60 + rim*180 + spec*80), 0, 255),
      g: cl(Math.round(140 + rim*100 + l*60 + spec*30), 0, 255),
      a: cl(0.35 + br*0.65, 0, 1),
      depth: cl((sz[i] + 0.6) / 1.2, 0, 1),                     // 0(뒤) ~ 1(앞): 앞쪽 숫자가 더 빠르고 크게
    };
    for(let k=0;k<=EXTRA_PER_DIGIT;k++){
      const main = (k === 0);
      const x = base.x + (main ? 0 : (Math.random()-.5)*34), y = base.y + (main ? 0 : (Math.random()-.5)*34);
      const ang = Math.atan2(y - cy, x - cx) + (Math.random()-.5)*(main ? 0.7 : 1.3);   // 중심에서 바깥쪽 + 흩어짐
      P.push({
        x0: x, y0: y, dx: Math.cos(ang), dy: Math.sin(ang),
        v: (900 + Math.random()*2000) * (0.75 + base.depth*0.6),   // 도달 거리(디자인 px)
        sw: (Math.random()-.5)*0.7,                                // 살짝 휘어지는 정도
        size: main ? base.size : base.size*(0.7 + Math.random()*0.5),
        gk: 0.5 + base.depth*0.9 + Math.random()*0.4,              // 커지는 정도
        r: base.r, g: base.g, a: main ? base.a : base.a*0.75,
        ch: chars[i],
      });
    }
  }
  return P;
}

// t: 0 → 1. 숫자가 바깥으로 가속하며 커지고 하얗게 밝아지고, 뒤쪽(t>0.55)에서 화면 전체가 하얗게 밝아짐
function renderBurst(t){
  const dpr = window.devicePixelRatio || 1;
  bctx.setTransform(1,0,0,1,0,0); bctx.clearRect(0,0,burstCv.width,burstCv.height);
  bctx.setTransform(dpr*SCALE,0,0,dpr*SCALE,dpr*OX,dpr*OY);
  bctx.textBaseline = 'middle'; bctx.textAlign = 'center';
  const e = Math.pow(t, 2.2), grow = Math.pow(t, 1.6) * 3.4, white = Math.min(1, t*1.5);
  const fade = t > 0.88 ? 1 - (t-0.88)/0.12 : 1;
  for(let n=0;n<particles.length;n++){
    const p = particles[n];
    if(Math.random() < 0.12) p.ch = rc();                          // 숫자가 계속 바뀜
    const ang = p.sw*t, cs = Math.cos(ang), sn = Math.sin(ang), d = p.v*e, ox = p.dx*d, oy = p.dy*d;
    const x = p.x0 + ox*cs - oy*sn, y = p.y0 + ox*sn + oy*cs;
    const size = Math.round(p.size * (1 + grow*p.gk) * K * 2) / 2;
    const r = Math.round(p.r + (255-p.r)*white), g = Math.round(p.g + (255-p.g)*white);
    bctx.font = 'bold ' + size + "px 'Courier New',monospace";
    bctx.fillStyle = 'rgba(' + r + ',' + g + ',255,' + ((p.a + (1-p.a)*white) * fade).toFixed(3) + ')';
    bctx.fillText(p.ch, x, y);
  }
  const f = Math.min(1, Math.max(0, (t-0.55)/0.4));
  flashEl.style.opacity = String(f*f*(3-2*f));                    // 부드럽게 하얗게
}

function go(){
  if(going) return; going = true;
  try{ sessionStorage.setItem('aquive_entry_flash', '1'); }catch(e){}   // 다음 화면이 하얀 빛에서 시작하도록 표시
  location.href = NEXT_URL;
}
function startBurst(manual){
  if(leaving) return; leaving = true;
  const dpr = window.devicePixelRatio || 1;
  burstCv.width = Math.round(window.innerWidth*dpr); burstCv.height = Math.round(window.innerHeight*dpr);
  burstCv.style.display = 'block';
  particles = buildParticles();
  cvs.style.visibility = 'hidden';                                // 원래 물고기 캔버스는 숨기고 전체 화면 캔버스가 이어받음
  stage.classList.add('leaving');                                 // 글자들은 빠르게 사라짐
  renderBurst(0);
  if(manual) return;                                              // (테스트용: 프레임을 직접 그릴 때)
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0)/BURST_MS);
    renderBurst(t);
    if(t < 1) burstRaf = requestAnimationFrame(step); else go();
  };
  burstRaf = requestAnimationFrame(step);
  setTimeout(go, BURST_MS + 800);                                 // 안전장치: 화면이 멈춰도 결국 이동
}
document.getElementById('connect').addEventListener('click', e => {
  if(e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // 새 탭 열기 등은 기본 동작 그대로
  if(reduceMotion()) return;                                                       // 동작 줄이기: 연출 없이 바로 이동
  e.preventDefault();
  startBurst();
});
['pointerdown','keydown'].forEach(ev => window.addEventListener(ev, () => { if(leaving) go(); }));   // 연출 도중 다시 누르면 바로 이동
window.__aq = { startBurst, renderBurst };                        // 확인용 (화면 동작에는 영향 없음)
</script>
