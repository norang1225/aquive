    row.appendChild(mkBtn('명단 전체 삭제', ()=>{ if(confirm('방문 명단을 모두 지울까요?')){ AquiveExhibit.clearNames(); render(); } }));
    row.appendChild(mkBtn('닫기', ()=> box.remove())); box.appendChild(row);
    const list = document.createElement('div'); list.style.cssText = 'border-top:1px solid #ddd;padding-top:10px;max-height:46vh;overflow:auto';
    names.slice().reverse().forEach(e=>{
      const r = document.createElement('div'); r.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:4px 0';
      const s = document.createElement('span'); s.textContent = e.n + '   ' + new Date(e.t).toLocaleString(); r.appendChild(s);
      const d = document.createElement('button'); d.textContent = '삭제'; d.style.cssText = 'padding:4px 12px;border:0;border-radius:8px;background:#f3d6d6;cursor:pointer;font:inherit';
      d.addEventListener('click', ()=>{ AquiveExhibit.removeName(e.t); render(); }); r.appendChild(d); list.appendChild(r);
    });
    box.appendChild(list);
  };
  render(); document.body.appendChild(box);
}
function initOperator(){
  const corner = document.createElement('div');
  corner.style.cssText = 'position:fixed;left:0;top:0;width:120px;height:120px;z-index:400;background:transparent';
  let timer = 0;
  corner.addEventListener('pointerdown', ()=>{ clearTimeout(timer); timer = setTimeout(openOperator, 2500); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => corner.addEventListener(ev, ()=> clearTimeout(timer)));
  document.body.appendChild(corner);
}
if(EX){ initOperator(); AquiveExhibit.startIdleReturn(); const mt = document.getElementById('me-tab'); if(mt) mt.href = 'card.html?mode=exhibit'; }      // 전시 모드: 운영자 모서리 + 무조작 자동 복귀

function openDex(){
  hidePopup();
  closeMap();
  closeMe();
  closeEnding();
  // 지금 있는 수조의 표지부터 펼친다
  dexTank = currentTankIdx;
  dexSpread = 0;
  renderDex('open');
  document.getElementById('dex-overlay').classList.add('open');
  document.getElementById('dex-toggle')?.classList.add('active');   // 오른쪽 '도감' 탭이 하늘색으로
}
function closeDex(){
  document.getElementById('dex-overlay')?.classList.remove('open');
  document.getElementById('dex-toggle')?.classList.remove('active');
}

// '도감' 탭은 열기/닫기 토글, 책 바깥(빈 곳)을 눌러도 닫힘
document.getElementById('dex-toggle')?.addEventListener('click', ()=>{
  document.getElementById('dex-overlay').classList.contains('open') ? closeDex() : openDex();
});
document.getElementById('dex-overlay')?.addEventListener('click', (e)=>{
  if(e.target.id === 'dex-overlay') closeDex();
});

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  if(popup.classList.contains('on')){ hidePopup(); return; }   // 정보창이 열려 있으면 정보창부터 닫기
  if(window.AquiveAvatars?.isOpen()){ AquiveAvatars.closeChooser(); return; }           // 프로필 선택 창부터
  if(endIsOpen()){ closeEnding(); return; }                                              // 전시 끝 화면
  if(meIsOpen()) closeMe();
  else if(document.getElementById('dex-overlay')?.classList.contains('open')) closeDex();
  else if(document.getElementById('map-overlay')?.classList.contains('open')) closeMap();
});

updateDexBadge();

function getDepth(){
  try{ return JSON.parse(localStorage.getItem('aquive_depth')||'{"depth":0}').depth; }
  catch(e){ return 0; }
}

function isTankUnlocked(tank){
  return true; // [master] 모든 수조 해금                       // 전시 모드: 모든 수조가 열려 있음
  const depth = getDepth();
  if(tank.autoUnlock) return depth >= 4000;
  return depth >= Math.abs(tank.unlock);
}

function buildNavDots(){
  const wrap = document.getElementById('tank-nav-dots');
  if(!wrap) return;
  wrap.innerHTML = '';
  TANKS.forEach((tank,i)=>{
    const dot = document.createElement('div');
    dot.className = 'nav-dot'+(i===currentTankIdx?' active':'')+(!isTankUnlocked(tank)?' locked':'');
    dot.title = tank.name;
    dot.addEventListener('click', ()=> tryNav(i));
    wrap.appendChild(dot);
  });
}

// 10/10 이 되면 'complete!' 로 바뀌었다가 사라짐. 한 번 보여준 뒤에는(이 기기에서) 다시 나타나지 않음
//  · 전시 모드는 처음부터 전부 열려 있으므로 옛날처럼 숫자를 그대로 둠
let unlockHudDone = false;
function updateUnlockHud(unlocked){
  const el = document.getElementById('hud-unlock'); if(!el || EX || unlockHudDone) return;
  const KEY = 'aquive_complete_seen', persist = !window.AQUIVE_LOCAL_ONLY;      // 마스터(전체 해금본)는 기록을 남기지 않음
  const seen = persist && (()=>{ try{ return localStorage.getItem(KEY) === '1'; }catch(e){ return false; } })();
  if(unlocked < COUNTED_TANKS.length){ el.style.display = ''; return; }
  unlockHudDone = true;
  if(seen){ el.style.display = 'none'; return; }
  el.textContent = 'complete!';
  el.animate([{opacity:0},{opacity:1}], {duration:500, fill:'both'});
  setTimeout(()=>{
    const a = el.animate([{opacity:1},{opacity:0}], {duration:900, fill:'forwards'});
    a.onfinish = ()=>{ el.style.display = 'none'; };
    if(persist) try{ localStorage.setItem(KEY, '1'); }catch(e){}
  }, 3000);
}

function updateNavUI(){
  const tank = TANKS[currentTankIdx];
  const hudName = document.getElementById('hud-name');
  if(hudName) hudName.textContent = tank.name;
  if(EX) setHudDepth(Math.abs(tank.unlock));   // 전시: 대수조 0m, 연안수조 50m …
  const unlocked = COUNTED_TANKS.filter(t => isTankUnlocked(t)).length;   // 해금된 수조 a/10
  const uc = document.getElementById('hud-unlock-cur'), ut = document.getElementById('hud-unlock-total');
  if(uc) uc.textContent = unlocked;
  if(ut) ut.textContent = COUNTED_TANKS.length;
  updateUnlockHud(unlocked);
  const prevBtn = document.getElementById('nav-prev');
  const nextBtn = document.getElementById('nav-next');
  if(prevBtn) prevBtn.disabled = currentTankIdx===0;
  if(nextBtn) nextBtn.disabled = currentTankIdx===TANKS.length-1;
  buildNavDots();
  if(document.getElementById('map-overlay')?.classList.contains('open')){
    renderMapFloor(mapCurrentFloor);
  }
}

function showLockToast(tank){
  const toast = document.getElementById('lock-toast');
  const msg   = document.getElementById('lock-msg');
  if(!toast||!msg) return;
  const needed  = Math.abs(tank.unlock);
  const current = getDepth();
  const diff    = needed-current;
  msg.innerHTML = tank.name+'<br>수심 '+tank.unlock+'m 도달 시 해금<br><span style="color:rgba(120,190,255,0.5);font-size:10px">현재 -'+current+'m · '+diff+'m 더 필요</span>';
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> toast.classList.remove('show'), 2800);
}

function tryNav(idx){
  const tank = TANKS[idx];
  if(!isTankUnlocked(tank)){ showLockToast(tank); return; }
  return switchTankWithData(idx);   // 끝날 때까지 기다릴 수 있도록 Promise를 돌려줌
}

async function switchTankWithData(idx){
  if(idx === currentTankIdx) return;
  closeEnding();                            // 전시 엔딩 크레딧이 열려 있으면 닫고 이동
  const overlay = document.getElementById('tank-overlay');
  if(overlay) overlay.classList.add('fade-in');
  await new Promise(r => setTimeout(r, 350));
  currentTankIdx = idx;
  updateNavUI();
  await applyTankData(TANKS[idx].id); // 데이터 키는 인덱스가 아니라 tank id
  if(overlay) overlay.classList.remove('fade-in');
  if(EX && TANKS[idx].id === END_TANK_ID) setTimeout(()=>{ if(currentTankIdx === idx) openEnding(); }, 1600);   // 전시: 멸종보관소에 닿으면 명단 창
}

// 화살표 이벤트
document.getElementById('nav-prev')?.addEventListener('click', ()=>{
  if(currentTankIdx > 0) tryNav(currentTankIdx-1);
});
document.getElementById('nav-next')?.addEventListener('click', ()=>{
  if(currentTankIdx < TANKS.length-1) tryNav(currentTankIdx+1);
});

// 초기 로드
(async function(){
  // card.html 의 "이어서" 탭: ?start=continue → 마지막으로 본 수조로 이동
  let resumeId = null;
  const openWhat = new URLSearchParams(location.search).get('open');   // 'dex' | 'map' : card.html 의 Collect / Map 을 눌러 들어온 경우
  if(new URLSearchParams(location.search).get('start') === 'continue'){
    try{ resumeId = (JSON.parse(localStorage.getItem('aquive_progress')||'{}')).lastTankId; }catch(e){}
  }
  await loadTanksJson();
  await applyTankData(0);
  updateNavUI();       // HUD: 수조 이름 / 해금된 수조 수
  updateDexBadge();
  if(Number.isFinite(resumeId)){
    const idx = TANKS.findIndex(t => t.id === resumeId);
    if(idx > 0) await tryNav(idx);   // 잠긴 수조면 기존처럼 잠금 안내가 뜸 (이동이 끝난 뒤에 열도록 기다림)
  }
  if(openWhat === 'dex' || openWhat === 'map'){
    openWhat === 'dex' ? openDex() : openMap();
    const u = new URL(location.href); u.searchParams.delete('open'); history.replaceState(null, '', u.pathname + u.search);   // 새로고침해도 다시 열리지 않게
  }
})();
