<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AQUIVE — Grand Ocean Tank</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Cinzel:wght@400;600&family=Oxanium:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#042840}
body{font-family:'Raleway',sans-serif;user-select:none}

#wrap{width:100vw;height:100vh;position:relative;overflow:hidden}

/* ── 배경 레이어 ── */
/* 이미지 자체에 패럴랙스 여유분 포함 (4880px 기준) */
#layer-background {
  position:absolute;
  top:0;
  left:-120px;
  width:calc(100% + 240px);
  height:100%;
  vertical-align:top;
  z-index:1;
  display:none;
}

/* volume/caustic: 효과 레이어라 height:auto (비율 유지), top으로 위치 이동 */
#layer-bg-caustic,
#layer-bg-volume {
  position:absolute;
  top:0;
  left:-120px;
  width:calc(100% + 240px);
  height:auto;
  vertical-align:top;
  display:none;
}
#layer-bg-caustic{
  z-index:3;mix-blend-mode:screen;pointer-events:none;
  animation:caustic-sway 4s ease-in-out infinite;
  transform-origin: top center;  /* 위쪽 기준으로 줄어들어 모서리가 안 보임 */
}
#layer-bg-volume {z-index:2;mix-blend-mode:screen;pointer-events:none;opacity:0.7}

/* near-obj: 근경 오브젝트 - 바닥 위, 물고기 near 아래 (옛 이름 mid-obj) */
#layer-near-obj {
  position:absolute;
  bottom:0;
  left:-120px;
  width:calc(100% + 240px);
  height:auto;
  vertical-align:top;
  z-index:23;
  pointer-events:none;
  display:none;
}

/* far-obj: 원경 오브젝트 - caustic 위, 물고기 far 아래 */
#layer-far-obj {
  position:absolute;
  bottom:0;
  left:-120px;
  width:calc(100% + 240px);
  height:auto;
  vertical-align:top;
  z-index:5;
  pointer-events:none;
  display:none;
}

/* ── 바닥 레이어 (이미지 자체에 여유분 포함) ── */
#layer-floor-base,
#layer-floor-obj {
  position:absolute;
  bottom:0;
  left:-120px;
  width:calc(100% + 240px);
  height:auto;
  display:none;
  pointer-events:none;
  vertical-align:top;
}
#layer-floor-base { z-index:15; }
#layer-floor-obj  { z-index:17; }

/* 대수조: background만 세로로 늘어남 (JS recalcGrandWorld()가 px로 설정)
   volume/caustic/near-obj는 화면 높이 유지 — 스크롤 시 반복 표시되는 효과용 */
.grand-mode #layer-background {
  height:300%;  /* fallback, JS 로드 후 px로 덮어씌워짐 */
}

@keyframes caustic-sway{
  0%  { transform:scaleX(0.94) scaleY(0.97); opacity:0.7; }
  50% { transform:scaleX(1.06) scaleY(1.03); opacity:1.0; }
  100%{ transform:scaleX(0.94) scaleY(0.97); opacity:0.7; }
}

/* ── 수면 반사 shimmer 이미지 레이어 ── */
#layer-shimmer-img{
  position:absolute;
  top:0; left:-120px;
  width:calc(100% + 240px);
  height:100%;
  z-index:50;pointer-events:none;
  object-fit:cover;
  display:none;
  animation:shimmer-breathe 5s ease-in-out infinite alternate;
}
@keyframes shimmer-breathe{
  from{ opacity:0.3; }
  to  { opacity:0.7; }
}

/* ── 프레임 이미지 레이어 ── */
#layer-frame-img{
  position:absolute;
  top:0; left:0;
  width:100%;
  height:auto;
  z-index:55;pointer-events:none;
  display:none;
}
/* ── 기본 그라디언트 배경 (PNG 없을 때) ── */
#default-bg{
  position:absolute;inset:0;z-index:0;
  background:linear-gradient(180deg,
    #2ab8f0 0%,#18a0e0 10%,#1080c8 28%,
    #0c60a0 55%,#084878 80%,#042840 100%
  );
}
/* 기본 수광 */
#default-caustic{
  position:absolute;inset:0;z-index:0;
  background:radial-gradient(ellipse 70% 55% at 50% -5%,rgba(200,245,255,0.3) 0%,transparent 100%);
  pointer-events:none;
}

/* ── 캔버스 ── */
#cvs-far{position:absolute;inset:0;z-index:10}
#cvs-mid{position:absolute;inset:0;z-index:20}
#cvs-fg {position:absolute;inset:0;z-index:30}

/* ── 수면 ── */
#surface-overlay{
  position:absolute;top:0;left:0;right:0;height:22%;
  z-index:35;pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(160,235,255,0.2) 0%,transparent 100%);
}

/* ── 기포 ── */
#bubbles1{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}
#bubbles2{position:absolute;inset:0;z-index:38;pointer-events:none;overflow:hidden}
.bub1,.bub2{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,255,255,0.2) 0%,rgba(200,240,255,0.06) 55%,transparent 100%);
}

/* ── 수류 캔버스 ── */

/* ── 팝업 ── */
/* ── 인물 (Figma 인물, 2560×1440 기준): 바인더 + 꺼내 놓은 ID card ── */
#me-overlay{position:fixed;inset:0;z-index:80;visibility:hidden}
#me-overlay.open{visibility:visible}
#me-stage{position:absolute;left:50%;top:0;width:2560px;height:1440px;margin-left:-1280px;transform-origin:50% 0;transform:scale(var(--u));pointer-events:none}
#me-stage > *{position:absolute}
.me-solid{pointer-events:auto}
.me-font{font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;font-weight:400;line-height:normal;white-space:nowrap}
.me-glass{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.me-cover{padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;border-radius:2px;transition:background .2s}
.me-cover:hover{background:rgba(255,255,255,.07)}
.me-cover:focus-visible{outline:3px solid #4BB4FF;outline-offset:4px}
.me-badge{pointer-events:none;transform:rotate(9.2deg);transform-origin:50% 50%}
.me-badge > *{position:absolute}
.me-badge button{pointer-events:auto;cursor:pointer}
.me-tabbtn{width:80px;height:282px;padding:0;border:0;background:none;color:#fff;font-family:'Inter','Noto Sans KR',sans-serif;font-size:24px;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.me-tabbtn span{position:absolute;left:16px;width:40px;text-align:center;line-height:29px;transition:text-shadow .2s}
.me-tabbtn:hover span{text-shadow:0 0 12px rgba(255,255,255,.9)}
.me-tabbtn:focus-visible{outline:3px solid #fff;outline-offset:-6px}
.me-hit{padding:0;border:0;background:transparent;cursor:pointer;pointer-events:auto;transition:background .2s;-webkit-tap-highlight-color:transparent}
.me-hit-light:hover{background:rgba(0,0,0,.05)}
.me-hit-dark:hover{background:rgba(255,255,255,.08)}
.me-hit:focus-visible{outline:3px solid #4BB4FF;outline-offset:-3px}
.me-idrow{display:flex;align-items:baseline;font-size:30px;color:#000}
.me-idrow .me-k{display:inline-block;width:112px}
.me-idrow > span:last-child{line-height:0}   /* 값 칸의 높이는 0: 한글 글꼴이 줄을 높이지 않아 세 줄의 간격이 항상 같음 */      /* 값은 라벨에서 112px 오른쪽 (시안: x 1207 → 1319) */
.me-thumb{background:#d9d9d9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.me-thumb img{max-width:92%;max-height:92%;object-fit:contain}

/* ── 전시: 멸종보관소 엔딩 크레딧 (Figma 전시용 마지막 2062:223 / 2062:298, 2560×1440 기준) ──
   패널 위 화면은 HUD(z 90) 아래에 떠서 탭·화살표는 그대로 보이고 눌러진다 */
#end-overlay{position:fixed;left:0;top:0;right:0;bottom:0;z-index:80;visibility:hidden}
#end-overlay.open{visibility:visible}
#end-stage{position:absolute;left:50%;top:0;width:2560px;height:1440px;margin-left:-1280px;transform-origin:50% 0;transform:scale(var(--u));pointer-events:none}
#end-stage > *{position:absolute}
.end-panel{background:rgba(0,0,0,.8);border-radius:15px;pointer-events:auto}
.end-panel > *{position:absolute}
.end-t{font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;font-weight:400;line-height:normal;white-space:nowrap;color:#fff}
.end-vp{overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 86.7%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 86.7%,transparent 100%)}
.end-track{position:absolute;will-change:transform}   /* 크레딧이 올라가는 판 (top으로 첫 줄 위치, transform으로 이동) */
.end-track > *{position:absolute}
.end-name,.end-msg{text-align:center;font-size:30px}
.end-name{width:400px}
.end-msg{left:0;width:1842px}
.end-name.me,.end-msg.me{color:#4BB4FF}
.end-btn{width:300px;height:100px;border:0;border-radius:25px;background:#4bb4ff;color:#fff;font-family:'Inter','Noto Sans KR',sans-serif;font-size:32px;font-weight:400;cursor:pointer;transition:filter .2s,transform .1s}
.end-btn:hover{filter:brightness(1.1)}
.end-btn:active{transform:scale(.98)}
.end-btn:focus-visible{outline:3px solid #fff;outline-offset:4px}

/* ── 물고기 정보창 (Figma 물고기 정보, 900×300 · 2560×1440 기준) ──
   --u 배율로 축소/확대. 눌러서 열고, 바깥을 누르거나 Esc로 닫는다. 설명이 길면 안에서 스크롤(휠·바 모두 가능) */
#popup{
  position:fixed;left:0;top:0;z-index:200;width:900px;height:300px;
  transform-origin:0 0;transform:scale(var(--u));
  border-radius:25px;background:rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  color:#000;font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;font-weight:400;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s,visibility 0s linear .2s;
}
#popup.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s,visibility 0s}
/* 글자 선택·복사 가능 (드래그, 더블클릭, Ctrl/Cmd+C). 전시 모드에서는 별도 차단 */
#popup{-webkit-user-select:text;user-select:text}          /* 카드 전체가 선택 영역: 카드 안 여백까지 끌어도 선택이 이어짐 */
#p-name,#p-lat,#p-desc{cursor:text}
#p-img{position:absolute;left:30px;top:32px;width:392px;height:235px;display:flex;align-items:center;justify-content:center;pointer-events:none}
#p-img img{max-width:100%;max-height:100%;object-fit:contain}
#p-name{position:absolute;left:452px;top:32px;width:380px;font-size:30px;line-height:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#p-lat {position:absolute;left:452px;top:75px;width:380px;font-size:30px;line-height:normal;color:rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#p-desc-wrap{position:absolute;left:452px;top:118px;width:418px;height:149px;overflow-y:auto;scrollbar-width:none}
#p-desc-wrap::-webkit-scrollbar{display:none}
#p-desc{font-size:20px;line-height:normal;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
/* 설명이 넘칠 때만 나타나는 스크롤바 (시안에는 없음: 계약서 화면의 스크롤바와 같은 모양으로 작게) */
#p-sb{position:absolute;left:880px;top:118px;width:10px;height:149px;border-radius:5px;background:rgba(0,0,0,.08);display:none;touch-action:none;cursor:pointer}
#p-sb.show{display:block}
#p-sb-thumb{position:absolute;left:0;top:0;width:10px;height:36px;border-radius:5px;background:rgba(0,0,0,.35);cursor:grab;touch-action:none}
#p-sb-thumb:active{cursor:grabbing}

/* ── HUD (Figma 대수조 85:146, 2560×1440 기준) ──
   --u = 화면 배율. JS가 min(가로/2560, 세로/1440)으로 설정 → 아이맥 27"(CSS 2560×1440)에서 1 = 시안 그대로 */
:root{--u:1;--px:calc(var(--u) * 1px)}
.hud-text{
  position:fixed;top:calc(30 * var(--px));z-index:90;
  font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;
  font-size:max(13px, calc(24 * var(--px)));font-weight:400;line-height:normal;
  color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:0 0 6px rgba(0,10,40,.55);   /* 밝은 배경에서도 읽히도록 (시안엔 없음, 어두운 배경에선 거의 안 보임) */
}
#hud-depth{left:calc(31 * var(--px))}
#hud-name {left:50%;transform:translateX(-50%)}
#hud-unlock{right:calc(31 * var(--px))}
#ui-depth{font-variant-numeric:tabular-nums}
#ui-tr{display:none}   /* 코드가 값을 써 넣는 옛 요소 (시안엔 없어서 숨김) */

/* 오른쪽 탭 (지도 / 도감 / 내 정보) */
.hud-tab{
  position:fixed;right:0;z-index:91;width:calc(80 * var(--px));padding:0;border:0;background:none;
  cursor:pointer;transition:filter .2s;-webkit-tap-highlight-color:transparent;
}
.hud-tab svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.hud-tab:hover{filter:brightness(1.4)}
.hud-tab.active svg path:first-child{fill:#4BB4FF}   /* 탭 모양만 하늘색(사람 아이콘은 흰색 유지) */
.hud-tab.active:hover{filter:none}   /* 활성 탭은 시안 색(#4BB4FF) 그대로 */   /* 지도가 열려 있는 동안 '지도' 탭 (시안: 하늘색) */
.hud-tab:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.tab-lg{height:calc(300 * var(--px))}
.tab-sm{height:calc(100 * var(--px))}
#map-toggle{top:calc(98 * var(--px))}
#dex-toggle{top:calc(398 * var(--px))}
#me-tab    {top:calc(698 * var(--px))}
.tab-txt{
  position:absolute;left:calc(20 * var(--px));top:calc(60 * var(--px));width:calc(40 * var(--px));
  font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;
  font-size:max(11px, calc(24 * var(--px)));font-weight:400;line-height:1.2;color:#fff;text-align:center;
}

/* 하단 좌우 화살표 (반투명 유리 사각형) */
.nav-arrow{
  position:fixed;bottom:calc(30 * var(--px));z-index:90;
  width:calc(50 * var(--px));height:calc(50 * var(--px));padding:0;border:0;border-radius:50%;
  background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  cursor:pointer;transition:background .2s,opacity .2s;-webkit-tap-highlight-color:transparent;
}
.nav-arrow svg{width:100%;height:100%;display:block}
#nav-prev{left:calc(50% - 257 * var(--px))}   /* 시안: x=1023 */
#nav-next{left:calc(50% + 207 * var(--px))}   /* 시안: x=1487 */
/* 버튼이 작아진 만큼 눈에 안 보이는 클릭 영역을 사방으로 넓힘 */
.nav-arrow::before{content:'';position:absolute;inset:calc(-14 * var(--px))}
.nav-arrow:hover{background:rgba(0,0,0,.58)}
.nav-arrow:focus-visible{outline:2px solid #fff;outline-offset:3px}
.nav-arrow:disabled{opacity:.2;cursor:default;pointer-events:none}

/* ── 대수조 세로 스크롤바 ── */
#grand-scrollbar{
  position:fixed;
  right:calc(80 * var(--px) + 24px);   /* 오른쪽 탭 왼쪽에 붙임 */
  top:50%;
  transform:translateY(-50%);
  width:4px;
  height:min(360px, 55vh);
  z-index:91;
  display:none;  /* onTankChanged에서 JS로 토글 */
}

#grand-scroll-track{
  position:absolute;inset:0;
  background:rgba(150,210,255,0.1);
  border-radius:2px;
  border:1px solid rgba(120,190,255,0.15);
}
#grand-scroll-handle{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:12px;
  border-radius:6px;
  background:rgba(160,220,255,0.55);
  border:1px solid rgba(200,240,255,0.4);
  cursor:grab;
  transition:background .15s, width .15s;
  /* 높이는 JS에서 계산 */
}
#grand-scroll-handle:hover,
#grand-scroll-handle.dragging{
  background:rgba(200,235,255,0.8);
  border-color:rgba(230,248,255,0.7);
  width:14px;
  cursor:grabbing;
}
/* 트랙 위아래 끝 표시 */
#grand-scroll-track::before,
#grand-scroll-track::after{
  content:'';
  position:absolute;
  left:50%;transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;
  background:rgba(150,210,255,0.25);
}
#grand-scroll-track::before{ top:-4px; }
#grand-scroll-track::after { bottom:-4px; }

/* ══════════════════════════════════════
   편집 패널
══════════════════════════════════════ */


/* ── 수조 전환 오버레이 ── */
#tank-overlay{
  position:fixed;inset:0;z-index:85;
  background:#000818;
  opacity:0;pointer-events:none;
  transition:opacity 0.35s ease;
}
#tank-overlay.fade-in{opacity:1;pointer-events:all;}

/* ── 잠금 수조 토스트 ── */
#lock-toast{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:130;
  background:rgba(0,10,30,0.9);
  border:1px solid rgba(100,180,255,0.2);
  border-radius:10px;padding:16px 24px;
  text-align:center;
  backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;
  transition:opacity 0.25s;
}
#lock-toast.show{opacity:1}
#lock-toast .lock-icon{font-size:24px;margin-bottom:8px}
#lock-toast .lock-msg{
  font-family:'Oxanium','Noto Sans KR',sans-serif;
  font-size:12px;letter-spacing:.14em;
  color:rgba(180,225,255,0.7);line-height:1.7;
}

/* ═══════════════════════════════════
   건물 지도 (Figma 지도1F / 지도B1F / 지도B2F, 2560×1440 기준)
   - 디자인 좌표 그대로 그리고 --u 배율로 축소/확대. HUD(z 90~91) 아래에 떠서 HUD는 그대로 보인다.
   - 오버레이에는 어두운 막(scrim)이 없다 (시안: 패널 뒤만 블러). 패널 바깥을 누르면 닫힌다.
════════════════════════════════════ */
#map-overlay{position:fixed;inset:0;z-index:80;visibility:hidden}
#map-overlay.open{visibility:visible}
#map-stage{position:absolute;left:50%;top:0;width:2560px;height:1440px;margin-left:-1280px;transform-origin:50% 0;transform:scale(var(--u));pointer-events:none}
#map-stage > *{position:absolute}
#map-panel{background:rgba(52,60,63,.8);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);pointer-events:auto}
.map-tab-shape,.map-decor{display:block;pointer-events:none}
.map-tab{
  width:300px;height:80px;padding:0;border:0;background:none;color:#fff;
  font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:30px;font-weight:400;line-height:normal;text-align:center;
  cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent;
}
.map-tab.active{cursor:default}
.map-tab:focus-visible{outline:2px solid #fff;outline-offset:-6px}

   도감 (Figma 도감 / 도감2, 2560×1440 기준) — 책을 펼친 모양 + 좌우 책갈피
   - 지도와 같은 방식: 디자인 좌표로 그리고 --u 배율. HUD(z 90~91) 아래에 떠서 HUD는 그대로 보인다.
════════════════════════════════════ */
#dex-overlay{position:fixed;inset:0;z-index:80;visibility:hidden}
#dex-overlay.open{visibility:visible}
#dex-stage{position:absolute;left:50%;top:0;width:2560px;height:1440px;margin-left:-1280px;transform-origin:50% 0;transform:scale(var(--u));pointer-events:none}
#dex-stage > *{position:absolute}
#dex-stage{perspective:6500px}   /* 클수록 원근감이 약해짐 (책장이 화면 밖으로 커져 나가지 않게) */
.dex-grp,.dex-leaf,.dex-face{position:absolute;left:0;top:0;width:2560px;height:1440px;pointer-events:none}
.dex-grp > *{position:absolute}   /* 페이지 묶음 안의 요소도 좌표(left/top)로 배치 */
.dex-leaf{transform-origin:1280px 720px;transform-style:preserve-3d;will-change:transform}
.dex-leaf *{pointer-events:none !important}
.dex-old *{pointer-events:none !important}
.dex-face{-webkit-backface-visibility:hidden;backface-visibility:hidden}
.dex-face-back{transform:rotateY(180deg)}
.dex-shade{position:absolute;background:#000;opacity:0;pointer-events:none}
.dex-font{font-family:'Inter','Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;font-weight:400;line-height:normal;white-space:nowrap}
.dex-page{display:block;pointer-events:none}
.dex-page svg{display:block;pointer-events:none}
.dex-page svg path{pointer-events:auto}
.dex-page-cover{pointer-events:auto;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.dex-ring{width:100px;height:20px;border-radius:15px;background:rgba(123,136,152,.9);pointer-events:none}
.dex-tab{width:50px;height:100px;padding:0;border:0;cursor:pointer;pointer-events:auto;background:rgba(255,255,255,.8);transition:background .2s;-webkit-tap-highlight-color:transparent}
.dex-tab.left{border-radius:25px 0 0 25px}
.dex-tab.right{border-radius:0 25px 25px 0}
.dex-tab:not(.current):not(.locked):hover{background:rgba(255,255,255,.96)}

<script>
// HUD 배율: 디자인(2560×1440) 대비 현재 창 크기 (CSS의 --u)
(function(){
  const set = () => document.documentElement.style.setProperty('--u', Math.min(window.innerWidth/2560, window.innerHeight/1440));
  window.addEventListener('resize', set); set();
})();
</script>
<script>
// ══════════════════════════════════════════
//  티어 배율
// ══════════════════════════════════════════
const EX = !!(window.AquiveExhibit && window.AquiveExhibit.active);   // 전시 모드 (?mode=exhibit)
const TIER_SCALE = {xl:4.0, lg:2.2, sl:1.5, md:0.58, sm:0.32};

// ══════════════════════════════════════════
//  캔버스
// ══════════════════════════════════════════
const farCvs = document.getElementById('cvs-far');
const midCvs = document.getElementById('cvs-mid');
const fgCvs  = document.getElementById('cvs-fg');
const farCtx = farCvs.getContext('2d');
const midCtx = midCvs.getContext('2d');
const fgCtx  = fgCvs.getContext('2d');

// ── Retina(HiDPI) 대응 ──
// 캔버스 물리 픽셀 = 논리 픽셀 × dpr
// ctx는 dpr배로 스케일해서 논리 픽셀 좌표로 그리면 됨
const DPR = window.devicePixelRatio || 1;

function resize(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  [farCvs, midCvs, fgCvs].forEach(c => {
    c.width  = Math.round(vw * DPR);
    c.height = Math.round(vh * DPR);
    c.style.width  = vw + 'px';
    c.style.height = vh + 'px';
  });
  // ctx 스케일 초기화 후 dpr 적용
  [farCtx, midCtx, fgCtx].forEach(ctx => {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  });
}
resize();
window.addEventListener('resize',()=>{resize();rebuildFish();});

// ══════════════════════════════════════════
//  물고기 인스턴스
// ══════════════════════════════════════════
let FISH = [];   // 런타임 인스턴스
let fishData = [];

// 물고기 1건(fd)은 layers 맵({near:n, mid:n, far:n, bot:n})으로 여러 거리에 동시에 배치될 수 있다.
// 구버전 데이터({layer, count})는 자동으로 {layer: count}로 변환한다.
const FISH_LAYER_KEYS = ['near','mid','far','bot'];
function fishLayerMap(fd){
  if(fd.layers && typeof fd.layers === 'object'){
    const m = {};
    FISH_LAYER_KEYS.forEach(k=>{
      const n = parseInt(fd.layers[k]) || 0;
      if(n > 0) m[k] = n;
    });
    if(Object.keys(m).length) return m;
  }
  return { [fd.layer || 'mid']: parseInt(fd.count) || 1 };
}

// 수조별 움직임 종류: 두족류관(8)·해파리관(9)은 물고기처럼 좌우로 헤엄치지 않고
// 둥둥 떠다니며 맥동하는 느낌이라 별도 움직임을 쓴다. (loop() 안에서 분기)
function moveTypeNow(){
  const tk = (typeof TANKS !== 'undefined') ? TANKS[currentTankIdx] : null;
  if(!tk) return 'fish';
  if(tk.id === 9) return 'jelly';   // 해파리관: 느리게 위아래로 맥동
  if(tk.id === 8) return 'octo';    // 두족류관: 느리게 둥둥 떠다님
  return 'fish';
}

function buildInstance(fd){
  // fd: {id, name, latin, desc, dep, tier, layers | (layer,count), speed, src}
  const vw = logicalW();
  const vh = logicalH();
  const tierScl = TIER_SCALE[fd.tier]||1;   // 크기(티어)는 등록 1건당 고정
  // 물고기별 '움직임' 설정이 있으면 그것을, 없으면(자동) 수조 기본을 씀
  const moveType = (fd.moveType === 'fish' || fd.moveType === 'jelly' || fd.moveType === 'octo') ? fd.moveType : moveTypeNow();
  // 기준 크기: 이미지 원본 비율 유지, 너비 200px 기준
  const baseW = 200;
  const baseH = fd.imgH && fd.imgW ? baseW * (fd.imgH/fd.imgW) : 80;

  const img = new Image();   // 이미지는 모든 거리가 공유
  img.src = fd.src;

  const instances = [];
  Object.entries(fishLayerMap(fd)).forEach(([layer, cnt])=>{
    let depthScl, yMin, yMax, da;
    switch(layer){
      case 'far':  depthScl=0.52; yMin=vh*.05; yMax=vh*.52; da=0.48; break;
      case 'bot':  depthScl=0.82; yMin=vh*.78; yMax=vh*.91; da=0.82; break;
      case 'near': depthScl=1.12; yMin=vh*.08; yMax=vh*.88; da=1.0;  break;
      default:     depthScl=0.9;  yMin=vh*.12; yMax=vh*.78; da=0.78;
    }
    const w = baseW * tierScl * depthScl;
    const h = baseH * tierScl * depthScl;
    for(let i=0;i<cnt;i++){
      instances.push({
        fd, layer, img, w, h, da,      // layer: 인스턴스별 거리
        moveType,                      // 'fish' | 'jelly' | 'octo'
        x: Math.random()*(vw+w*2)-w,
        y: yMin+Math.random()*(yMax-yMin),
        yMin, yMax,
        dir: Math.random()>.5?1:-1,
        t: Math.random()*300,
        phase: Math.random()*Math.PI*2,
        sm: 0.82+Math.random()*.36,
      });
    }
  });
  return instances;
}


// ══════════════════════════════════════════
//  수심 시스템
//  - 방문마다 -10m, 최대 -4000m
//  - localStorage 기반 (로그인 연동 전 임시)
// ══════════════════════════════════════════
const DEPTH_PER_VISIT = 10;
const MAX_DEPTH = 4000;

function getDepthData() {
  try {
    return JSON.parse(localStorage.getItem('aquive_depth') || '{"visits":0,"depth":0}');
  } catch(e) { return {visits:0, depth:0}; }
}
function saveDepthData(obj) {
  try { localStorage.setItem('aquive_depth', JSON.stringify(obj)); } catch(e) {}
}

function recordVisit() {
  const data = getDepthData();
  // 같은 세션 중복 카운트 방지
  const lastVisit = localStorage.getItem('aquive_last_session');
  const sessionKey = Math.floor(Date.now() / (1000 * 60 * 30)).toString(); // 30분 단위 세션
  if(lastVisit !== sessionKey) {
    data.visits = Math.min(data.visits + 1, MAX_DEPTH / DEPTH_PER_VISIT);
    data.depth  = data.visits * DEPTH_PER_VISIT;
    saveDepthData(data);
    localStorage.setItem('aquive_last_session', sessionKey);
    window.AquiveSync?.push();   // 계정 기록 저장 (로그인한 경우에만 동작)
  }
  return data;
}

function renderDepth() {
  if(EX) return;                              // 전시 모드: 수조별 수심을 씀 (updateNavUI → setHudDepth)
  const data = getDepthData();
  const depthEl = document.getElementById('ui-depth');
  const visitEl = document.getElementById('ui-visit');
  if(!depthEl) return;

  // 숫자 카운트업 애니메이션
  const target = data.depth;   // 새 HUD: '수심 100m' (양수 표기)
  let current = 0;
  const step = target / 40;
  let frame = 0;
  function countUp() {
    frame++;
    current += step;
    if(frame >= 40) {
      depthEl.textContent = target.toLocaleString();
    } else {
      depthEl.textContent = Math.round(current).toLocaleString();
      requestAnimationFrame(countUp);
    }
  }
  if(data.depth === 0) {
    depthEl.textContent = '0';
  } else {
    requestAnimationFrame(countUp);
  }

  // 방문 횟수 표시
  const remaining = MAX_DEPTH / DEPTH_PER_VISIT - data.visits;
  if(visitEl) {
    if(data.depth >= MAX_DEPTH) {
      visitEl.textContent = '최대 수심 도달 · ―4,000m';
    } else {
      visitEl.textContent = `${data.visits}회 방문 · 다음 방문까지 ―${DEPTH_PER_VISIT}m`;
    }
  }
}

const popup = document.getElementById('popup');
const pDescWrap = document.getElementById('p-desc-wrap');
const pSb = document.getElementById('p-sb'), pThumb = document.getElementById('p-sb-thumb');
const POP_SB_H = 149, POP_THUMB_MIN = 36, POP_IDLE_MS = 25000;   // 스크롤 트랙 높이 / 손잡이 최소 / 조작 없이 두면 자동으로 닫히는 시간
let popT;
const popScale = () => Math.min(window.innerWidth/2560, window.innerHeight/1440);

// 설명이 넘칠 때만 스크롤바 표시 + 손잡이 위치/크기 갱신
function popupSyncBar(){
  const max = pDescWrap.scrollHeight - pDescWrap.clientHeight;
  if(max <= 1){ pSb.classList.remove('show'); return; }
  pSb.classList.add('show');
  const th = Math.max(POP_THUMB_MIN, Math.min(POP_SB_H, POP_SB_H * pDescWrap.clientHeight / pDescWrap.scrollHeight));
  pThumb.style.height = th + 'px';
  pThumb.style.top = (pDescWrap.scrollTop / max) * (POP_SB_H - th) + 'px';
}
pDescWrap.addEventListener('scroll', popupSyncBar);
function popupIdle(){ clearTimeout(popT); popT = setTimeout(hidePopup, POP_IDLE_MS); }
function hidePopup(){ popup.classList.remove('on'); clearTimeout(popT); }

function fillPopup(fd){
  document.getElementById('p-name').textContent = fd.name  || '';
  document.getElementById('p-lat').textContent  = fd.latin || '';
  document.getElementById('p-desc').textContent = fd.desc  || '';
  const im = document.getElementById('p-imgel'); im.src = fd.src || ''; im.alt = fd.name || '';
  pDescWrap.scrollTop = 0;
}
// 시안: 카드의 왼쪽 아래 모서리가 클릭한 물고기 근처(카드는 물고기 오른쪽 위). 화면 밖으로 나가면 안쪽으로 당김. mx가 없으면 화면 중앙
function placePopup(mx, my){
  const u = popScale(), W = 900*u, H = 300*u, vw = window.innerWidth, vh = window.innerHeight, topMin = 80*u, m = 10;
  let left, top;
  if(mx == null){ left = (vw-W)/2; top = (vh-H)/2; }
  else { left = mx; top = my - H; if(top < topMin) top = my + 24*u; }
  left = Math.max(m, Math.min(vw-W-m, left));
  top  = Math.max(topMin, Math.min(vh-H-m, top));
  popup.style.left = left+'px'; popup.style.top = top+'px';
  popup.classList.add('on');
  requestAnimationFrame(popupSyncBar);
  popupIdle();
}
function showPopup(fd,mx,my){
  fillPopup(fd);
  placePopup(mx,my);
  recordSighting(fd.id);
}

// 마우스 휠/트랙패드: 정보창 어디에 있어도(이미지·바 위 포함) 설명이 스크롤되고, 뒤의 수조(대수조 세로 스크롤)는 움직이지 않는다
popup.addEventListener('wheel', e=>{
  if(e.ctrlKey) return;
  e.preventDefault(); e.stopPropagation();
  const max = pDescWrap.scrollHeight - pDescWrap.clientHeight;
  if(max > 1){
    const u = popScale();
    const px = e.deltaMode===1 ? e.deltaY*40 : e.deltaMode===2 ? e.deltaY*pDescWrap.clientHeight*u : e.deltaY;
    pDescWrap.scrollTop += px / u;
  }
  popupIdle();
}, {passive:false});
// 스크롤바 드래그 / 트랙 클릭
let pGrab = 0, pDrag = false;
const popScrollTo = f => { pDescWrap.scrollTop = Math.max(0, Math.min(1, f)) * (pDescWrap.scrollHeight - pDescWrap.clientHeight); popupIdle(); };
pThumb.addEventListener('pointerdown', e=>{ pDrag = true; pThumb.setPointerCapture(e.pointerId); pGrab = e.clientY - pThumb.getBoundingClientRect().top; e.stopPropagation(); });
pThumb.addEventListener('pointermove', e=>{ if(!pDrag) return; const tr = pSb.getBoundingClientRect(), hr = pThumb.getBoundingClientRect(); popScrollTo((e.clientY - pGrab - tr.top) / (tr.height - hr.height)); });
pThumb.addEventListener('pointerup', ()=>{ pDrag = false; });
pThumb.addEventListener('pointercancel', ()=>{ pDrag = false; });
pSb.addEventListener('pointerdown', e=>{ const tr = pSb.getBoundingClientRect(), hr = pThumb.getBoundingClientRect(); popScrollTo((e.clientY - tr.top - hr.height/2) / (tr.height - hr.height)); });
popup.addEventListener('pointermove', popupIdle);

// 정보창 글자 복사: 이름 / 학명 / 설명이 서로 붙지 않고 줄로 나뉘어 복사됨 (관리자 페이지의 '정보 붙여넣기'가 이 모양을 알아봄)
//  · 드래그·더블클릭·세 번 클릭으로 고른 부분만 복사, Ctrl/Cmd+A 는 정보창의 글 전체 선택. 전시 모드에서는 동작하지 않음
document.addEventListener('copy', e=>{
  if(EX || !popup.classList.contains('on')) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount || !popup.contains(sel.anchorNode)) return;
  const r = sel.getRangeAt(0);
  const part = el => {
    const tn = el.firstChild; if(!tn || tn.nodeType !== 3 || !r.intersectsNode(tn)) return '';
    const a = (r.startContainer === tn) ? r.startOffset : 0, b = (r.endContainer === tn) ? r.endOffset : tn.length;
    return tn.data.slice(a, b);
  };
  const text = [document.getElementById('p-name'), document.getElementById('p-lat'), document.getElementById('p-desc')].map(part).filter(Boolean).join('\n');
  if(!text) return;
  e.clipboardData.setData('text/plain', text); e.preventDefault();
});
document.addEventListener('keydown', e=>{
  if(EX || !popup.classList.contains('on') || !(e.ctrlKey || e.metaKey) || (e.key !== 'a' && e.key !== 'A')) return;
  if(/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName)) return;
  e.preventDefault();
  const rg = document.createRange(); rg.selectNodeContents(popup);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
});

// 정보창 바깥을 누르면 닫힘. 도감/지도의 빈 곳을 누른 경우에는 정보창만 닫고 도감/지도는 그대로 둔다
// (정보창 안에서 글자를 드래그해 선택하다가 바깥에서 손을 떼도 닫히지 않게: 누르기 시작한 곳을 기억)
let popDownInside = false;
document.addEventListener('pointerdown', e=>{ popDownInside = popup.contains(e.target); }, true);
document.addEventListener('click', e=>{
  if(popDownInside){ popDownInside = false; return; }
  if(!popup.classList.contains('on') || popup.contains(e.target)) return;
  hidePopup();
  if(e.target.id === 'dex-overlay' || e.target.id === 'map-overlay'){ e.stopPropagation(); e.preventDefault(); }

[farCvs,midCvs,fgCvs].forEach(cvs=>{
  cvs.addEventListener('click',e=>{
    const mx=e.clientX,my=e.clientY;
    const grand = isGrandTank();
    // 가장 위(near)부터 역순으로 체크
    for(let i=FISH.length-1;i>=0;i--){
      const f=FISH[i];
      // 렌더링과 동일한 오프셋 계산
      let plxXKey = 'fishMid';
      if(f.layer==='far')  plxXKey = 'fishFar';
      if(f.layer==='near') plxXKey = 'fishNear';
      const fishPlxX   = -plx.curX * PLX_BG_MAX_X * PLX[plxXKey];
      const camOffsetY = grand
        ? cam.current * ((f.layer==='far') ? 0.85 : (f.layer==='near') ? 1.0 : 0.92)
        : 0;
      const fx = f.x + fishPlxX;
      const fy = f.y - f.h/2 - camOffsetY;
      const pad = 0.1;
      const hx = fx - f.w * pad;
      const hy = fy - f.h * pad;
      const hw = f.w * (1 + pad * 2);
      const hh = f.h * (1 + pad * 2);
      if(mx>=hx && mx<=hx+hw && my>=hy && my<=hy+hh){
        showPopup(f.fd,mx,my); break;
      }
    }

});


//  패럴랙스 + 대수조 세로 스크롤
// ══════════════════════════════════════════

// 현재 수조 인덱스 (패럴랙스/대수조 판별에 필요해서 여기서 선언)
let currentTankIdx = 0;

// 대수조 월드 높이 배율 (기본값: 이미지 로드 전 fallback)
const GRAND_WORLD_MULT_DEFAULT = 3;
let   grandWorldMult = GRAND_WORLD_MULT_DEFAULT;

// 이미지 실제 비율로 월드 높이 재계산
// background 이미지가 로드되면 호출됨
function recalcGrandWorld(){
  const img = document.getElementById('layer-background');
  if(!img || !img.naturalWidth || !img.naturalHeight) return;

  const containerW = window.innerWidth + 160;
  const containerH = window.innerHeight;

  // background 이미지 전체가 보이도록 필요한 높이
  const neededH = containerW * (img.naturalHeight / img.naturalWidth);
  grandWorldMult = neededH / containerH;

  // background/frame 레이어 전체 높이로 설정
  img.style.height = neededH + 'px';
  const frameEl = document.getElementById('layer-frame-img');
  if(frameEl) frameEl.style.height = neededH + 'px';

  // 카메라를 맨 아래(바닥)로 정확히 맞춤
  if(isGrandTank()){
    const maxScroll = neededH - containerH;
    cam.target  = maxScroll;
    cam.current = maxScroll;
  }

  // 물고기 범위 재배치
  applyGrandFishRange();
}

// 패럴랙스 레이어별 배율 (마우스 중앙 편차 × 이 값 = 이동 픽셀)
const PLX = {
  background: 0.04,
  volume:   0.08,
  caustic:  0.12,
  farobj:   0.18,  // 원경 오브젝트
  nearobj:  0.70,  // 근경 오브젝트 (바닥보다 앞이라 더 많이)  (옛 이름 midobj)
  floor:    0.45,
  floorobj: 0.55,
  shimmer:  0.10,
  frame:    0.00,
  fishFar:  0.35,
  fishMid:  0.60,
  fishNear: 0.85,
};

// 현재 패럴랙스 상태 (lerp target)
const plx = { mouseX: 0, mouseY: 0, curX: 0, curY: 0 };
// 대수조 세로 스크롤 카메라 오프셋
const cam = { target: 0, current: 0 };

// 마우스 추적 — X 패럴랙스 (모든 수조): 마우스의 좌우 위치가 배경 이동량이 된다
window.addEventListener('mousemove', e => {
  plx.mouseX = (e.clientX / window.innerWidth - 0.5);  // -0.5 ~ 0.5
});

// ── 대수조 스크롤바 드래그 ──
(function(){
  const bar    = document.getElementById('grand-scrollbar');
  const track  = document.getElementById('grand-scroll-track');
  const handle = document.getElementById('grand-scroll-handle');
  if(!bar || !track || !handle) return;

  let dragging = false;
  let dragStartY = 0;
  let dragStartCamTarget = 0;

  function trackH()  { return track.getBoundingClientRect().height; }
  function handleH() { return handle.getBoundingClientRect().height; }
  function scrollH() { return (grandWorldMult * window.innerHeight) - window.innerHeight; }

  // 핸들 크기: 트랙의 (1/grandWorldMult) 비율
  function updateHandleSize(){
    const th = trackH() || 360;
    handle.style.height = Math.round(th / grandWorldMult) + 'px';
  }

  // 카메라 위치 → 핸들 위치 동기화 (루프에서 매 프레임 호출)
  // 핸들 아래 = 바닥(시작), 핸들 위 = 수면(올라감)
  window.updateScrollHandle = function(){
    if(!isGrandTank()) return;
    updateHandleSize();
    const th = trackH();
    const hh = th / grandWorldMult;
    const travel = th - hh;
    const ratio  = scrollH() > 0 ? cam.current / scrollH() : 1;
    // ratio 반전: cam이 최대(바닥)=1 → 핸들 맨 아래, cam=0(수면) → 핸들 맨 위
    handle.style.top = Math.max(0, Math.min(travel, ratio * travel)) + 'px';
  };

  // 트랙 클릭 → 해당 위치로 즉시 이동
  track.addEventListener('mousedown', e => {
    if(e.target === handle) return;
    const rect  = track.getBoundingClientRect();
    const th    = rect.height;
    const hh    = th / grandWorldMult;
    const ratio = Math.max(0, Math.min(1, (e.clientY - rect.top - hh/2) / (th - hh)));
    cam.target  = ratio * scrollH();
    e.preventDefault();
  });

  // 핸들 드래그 시작
  handle.addEventListener('mousedown', e => {
    dragging = true;
    dragStartY = e.clientY;
    dragStartCamTarget = cam.target;
    handle.classList.add('dragging');
    e.preventDefault();
    e.stopPropagation();
  });

  // 드래그 중
  window.addEventListener('mousemove', e => {
    if(!dragging) return;
    const th     = trackH();
    const hh     = th / grandWorldMult;
    const travel = th - hh;
    const dy     = e.clientY - dragStartY;
    const ratio  = travel > 0 ? dy / travel : 0;
    cam.target   = Math.max(0, Math.min(scrollH(), dragStartCamTarget + ratio * scrollH()));
  });

  // 드래그 종료
  window.addEventListener('mouseup', () => {
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
  });

  // 휠 스크롤도 지원
  document.getElementById('wrap')?.addEventListener('wheel', e => {
    if(!isGrandTank()) return;
    cam.target = Math.max(0, Math.min(scrollH(), cam.target + e.deltaY * 0.8));
    e.preventDefault();
  }, { passive: false });
})();

// 패럴랙스 배경 레이어 업데이트 (CSS transform)
const PLX_BG_MAP = [
  { id: 'layer-background', key: 'background', baseLeft: -120 },
  { id: 'layer-bg-volume',  key: 'volume',   baseLeft: -120 },
  { id: 'layer-bg-caustic', key: 'caustic',  baseLeft: -120 },
  { id: 'layer-far-obj',    key: 'farobj',   baseLeft: -120 },
  { id: 'layer-floor-base', key: 'floor',    baseLeft: -120 },
  { id: 'layer-floor-obj',  key: 'floorobj', baseLeft: -120 },
  { id: 'layer-near-obj',   key: 'nearobj',  baseLeft: -120 },
  { id: 'layer-shimmer-img',key: 'shimmer',  baseLeft: -120 },
  // frame은 별도 처리
];
const PLX_BG_MAX_X = 60;   // X 최대 이동 픽셀 (여유분 120px 안에서 ±60px)
const PLX_BG_MAX_Y = 60;   // Y 최대 이동 픽셀 (대수조 세로 스크롤과 별개로 미세 패럴랙스)

function updateParallaxBg(isGrand){
  const dx = plx.curX * PLX_BG_MAX_X;

  PLX_BG_MAP.forEach(({ id, key, baseLeft }) => {
    const el = document.getElementById(id);
    if(!el || el.style.display === 'none') return;
    const scl  = PLX[key] || 0;
    const base = baseLeft ?? -120;

    // X: 패럴랙스 오프셋 (CSS left:-120px 기준에서 추가 이동)
    const offsetX = -dx * scl;

    if(key === 'caustic'){
      // caustic: @keyframes가 transform 사용
      // X → marginLeft, Y → marginTop 으로 우회 (transform 건드리지 않음)
      el.style.marginLeft = offsetX + 'px';
      el.style.marginTop  = isGrand ? (-cam.current + 'px') : '0px';

    } else if(key === 'floor' || key === 'floorobj' || key === 'nearobj' || key === 'farobj'){
      // 바닥/중경: X 패럴랙스 + 대수조에서 하단 기준 카메라 오프셋
      if(isGrand){
        const worldH  = window.innerHeight * grandWorldMult;
        const elH     = el.offsetHeight || 0;
        const offsetY = worldH - elH - cam.current;
        el.style.transform = `translateX(${offsetX}px) translateY(${offsetY}px)`;
        el.style.bottom    = 'auto';
        el.style.top       = '0px';
      } else {
        el.style.transform = `translateX(${offsetX}px)`;
        el.style.top       = 'auto';
        el.style.bottom    = '0px';
      }

    } else if(key === 'shimmer'){
      // shimmer: X만, top 고정
      el.style.transform = `translateX(${offsetX}px)`;

    } else {
      // background/volume 등: X + 대수조에서 카메라 오프셋
      const offsetY = isGrand ? -cam.current : 0;
      el.style.transform = `translateX(${offsetX}px) translateY(${offsetY}px)`;
    }
  });
}

// ── 대수조 전용 세팅 ──
function isGrandTank(){ return currentTankIdx === 0; }

function grandWorldH(){
  return window.innerHeight * grandWorldMult;
}

// 대수조에서 물고기 yMin/yMax를 월드 전체로 넓혀 재배치
function applyGrandFishRange(){
  if(!isGrandTank()) return;
  const vh  = logicalH();
  const wh  = grandWorldMult * vh;  // 월드 높이 (논리 픽셀)
  FISH.forEach(f => {
    switch(f.layer){
      case 'far':  f.yMin = wh*.03; f.yMax = wh*.55; break;
      case 'bot':  f.yMin = wh*.78; f.yMax = wh*.94; break;
      case 'near': f.yMin = wh*.05; f.yMax = wh*.90; break;
      default:     f.yMin = wh*.10; f.yMax = wh*.80; break;
    }
    // 현재 y가 새 범위 안에 들어오도록
    f.y = f.yMin + Math.random() * (f.yMax - f.yMin);
  });
}

// 수조 전환 시 호출
function onTankChanged(tankId){
  hidePopup();
  closeMe();
  window.AquiveSync?.noteTank(tankId);   // 마지막으로 본 수조 / 다녀간 수조 기록
  const wrap = document.getElementById('wrap');
  const scrollbar = document.getElementById('grand-scrollbar');

  if(tankId === 0){
    // 대수조: grand-mode + 세로 스크롤바 활성화
    wrap.classList.add('grand-mode');
    if(scrollbar) scrollbar.style.display = 'block';
    applyGrandFishRange();
    // volume/caustic: 대수조에서 height:auto (비율 유지, top으로 이동)
    ['layer-bg-volume','layer-bg-caustic'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.style.height = 'auto';
    });
    const initScrollH = (grandWorldMult * window.innerHeight) - window.innerHeight;
    cam.target  = initScrollH;
    cam.current = initScrollH;
    const handle = document.getElementById('grand-scroll-handle');
    if(handle) handle.style.top = '';
  } else {
    // 다른 수조: grand-mode 해제, 세로 스크롤바 숨김
    wrap.classList.remove('grand-mode');
    if(scrollbar) scrollbar.style.display = 'none';
    // background 높이 초기화
    const base = document.getElementById('layer-background');
    if(base) base.style.height = '';
    // volume/caustic: 일반 수조에서 height:100% (화면 꽉 채움)
    ['layer-bg-volume','layer-bg-caustic'].forEach(id => {
      const el = document.getElementById(id);
      if(el){ el.style.height = '100%'; el.style.top = '0px'; }
    });
    // 모든 배경 레이어 transform 초기화
    PLX_BG_MAP.forEach(({ id, key }) => {
      const el = document.getElementById(id);
      if(!el) return;
      el.style.transform  = 'none';
      el.style.marginLeft = '';
      el.style.marginTop  = '';
      if(key === 'floor' || key === 'floorobj' || key === 'nearobj' || key === 'farobj'){
        el.style.top = 'auto'; el.style.bottom = '0px';
      }
    });
    // frame 초기화
    const frameEl2 = document.getElementById('layer-frame-img');
    if(frameEl2){ frameEl2.style.transform = 'none'; frameEl2.style.height = ''; }
    // caustic top 초기화
    const causticEl = document.getElementById('layer-bg-caustic');
    if(causticEl) causticEl.style.transform = 'none';
  }

  // 패럴랙스 X는 수조 전환 시 중앙으로 부드럽게 복귀
  plx.mouseX = 0;
  plx.curX   = 0;
}

// ══════════════════════════════════════════
//  메인 루프
// ══════════════════════════════════════════
// 논리 픽셀 헬퍼 (캔버스는 DPR 배이므로 나눔)
function logicalW(){ return farCvs.width  / DPR; }
function logicalH(){ return farCvs.height / DPR; }

let t=0;
function loop(){
  const vw = logicalW();
  const vh = logicalH();
  t+=0.016;

  // ── lerp: 마우스 X → 패럴랙스 ──
  const LERP = 0.05;
  plx.curX += (plx.mouseX - plx.curX) * LERP;
  plx.curY += (plx.mouseY - plx.curY) * LERP;

  // ── 대수조: 스크롤바 → 카메라 오프셋 (lerp로 부드럽게) ──
  const grand = isGrandTank();
  if(grand){
    cam.current += (cam.target - cam.current) * LERP;
  }

  // ── 배경 패럴랙스 업데이트 ──
  updateParallaxBg(grand);

  // ── frame: background와 동일하게 카메라 따라감, X만 패럴랙스 ──
  const frameEl = document.getElementById('layer-frame-img');
  if(frameEl && frameEl.style.display !== 'none'){
    const offsetX = -(plx.curX * PLX_BG_MAX_X) * PLX['frame'];
    const offsetY = grand ? -cam.current : 0;
    frameEl.style.transform = `translateX(${offsetX}px) translateY(${offsetY}px)`;
  }

  // ── 스크롤바/슬라이더 핸들 동기화 ──
  if(grand && window.updateScrollHandle) window.updateScrollHandle();

  farCtx.clearRect(0,0,vw,vh);
  midCtx.clearRect(0,0,vw,vh);
  fgCtx.clearRect(0,0,vw,vh);

  FISH.forEach(f=>{
    f.t+=0.016;

    // ── 움직임 종류별 계수: 물고기는 기존 그대로, 해파리/문어는 느리고 둥둥 뜨는 느낌 ──
    const mt = f.moveType || 'fish';
    let xMul=1, yAmp=.55, yFreq=.42, snakeAmp=.028, snakeFreq=2.8, pulseAmp=0, pulseFreq=0;
    if(mt==='jelly'){        // 해파리관: 거의 제자리에서 천천히 위아래로 맥동, 좌우 이동은 느릿하게 표류
      xMul=0.4; yAmp=0.95; yFreq=0.22; snakeAmp=0.01; snakeFreq=0.6; pulseAmp=0.07; pulseFreq=1.4;
    } else if(mt==='octo'){  // 두족류관: 헤엄치지 않고 느리게 떠다님, 몸은 거의 안 꺾임
      xMul=0.55; yAmp=0.7; yFreq=0.3; snakeAmp=0.045; snakeFreq=0.9; pulseAmp=0.035; pulseFreq=0.8;
    }

    f.x += f.dir*f.fd.speed*f.sm*60*0.016*xMul;
    f.y += Math.sin(f.t*yFreq+f.phase)*yAmp;
    if(f.y<f.yMin) f.y=f.yMin;
    if(f.y>f.yMax) f.y=f.yMax;
    if(f.x> vw+f.w*2){f.dir=-1; f.x=vw+f.w;}
    if(f.x<-f.w*3)  {f.dir=1;  f.x=-f.w*2;}

    if(!f.img.complete||!f.img.naturalWidth) return;

    const snake=Math.sin(f.t*snakeFreq+f.phase)*snakeAmp;
    // 해파리/문어: 종(bell)·몸통이 부풀었다 줄어드는 맥동 효과 (세로로 커질 때 가로는 살짝 줄어듦)
    const pulse = pulseAmp ? 1+Math.sin(f.t*pulseFreq+f.phase)*pulseAmp : 1;
    let tc;
    switch(f.layer){
      case 'far':  tc=farCtx; break;
      case 'near': tc=fgCtx;  break;
      default:     tc=midCtx;
    }

    // ── 패럴랙스 X 오프셋 (물고기 레이어별) ──
    let plxXKey = 'fishMid';
    if(f.layer==='far')  plxXKey = 'fishFar';
    if(f.layer==='near') plxXKey = 'fishNear';
    const fishPlxX = -plx.curX * PLX_BG_MAX_X * PLX[plxXKey];

    // ── 대수조: 세로 카메라 오프셋 (물고기도 카메라와 함께 이동) ──
    // 레이어별 패럴랙스 배율로 살짝 차이
    let camOffsetY = 0;
    if(grand){
      const layerCamScl = (f.layer==='far') ? 0.85
                        : (f.layer==='near') ? 1.0
                        : 0.92;
      camOffsetY = cam.current * layerCamScl;
    }

    tc.save();
    tc.globalAlpha=f.da;
    tc.translate(f.x + fishPlxX, f.y - f.h/2 - camOffsetY);
    if(f.dir===1){tc.translate(f.w,0);tc.scale(-1,1);}
    tc.translate(f.w/2,f.h/2);
    tc.rotate(snake);
    if(pulseAmp) tc.scale(2-pulse, pulse);
    tc.translate(-f.w/2,-f.h/2);
    tc.drawImage(f.img,0,0,f.w,f.h);
    tc.restore();
  });

  requestAnimationFrame(loop);
}
loop();

// GitHub 설정 — 항상 이 값으로 고정
const GH_USER_KEY = 'aquive_gh_user';
const GH_REPO_KEY = 'aquive_gh_repo';
localStorage.setItem(GH_USER_KEY, 'norang1225');
localStorage.setItem(GH_REPO_KEY, 'aquive');
function getGhUser(){ return 'norang1225'; }
function getGhRepo(){ return 'aquive'; }

let remoteData = null;

async function loadTanksJson(){
  const user = getGhUser();
  const repo = getGhRepo();
  if(!user || !repo) return null;
  try{
    const url = `https://raw.githubusercontent.com/${user}/${repo}/main/data/tanks.json?t=${Date.now()}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const json = await res.json();
    remoteData = json.tanks || {};
    return remoteData;
  } catch(e){ return null; }
}


function fixImageUrl(url){
  if(!url) return url;
  // jsdelivr → raw로 변환 (jsdelivr 캐시 문제)
  if(url.includes('cdn.jsdelivr.net')){
    return url
      .replace('https://cdn.jsdelivr.net/gh/', 'https://raw.githubusercontent.com/')
      .replace('@main/', '/main/');
  }
  return url;
}

// 저장 데이터(tanks.json / 관리자)의 옛 키 → 새 레이어 이름. 저장된 키는 그대로 두고(base, midobj) 새 이름(background, nearobj)도 읽을 수 있음
const BG_KEY_ALIAS = { base:'background', midobj:'nearobj' };
function applyBgFromData(bgRaw, opts){
  console.log('[AQUIVE] applyBgFromData:', JSON.stringify(bgRaw));
  const defaultLight = !(opts && opts.defaultLight === false);   // 수조 데이터 defaultLight:false 이면 caustic 이미지가 없어도 기본 빛을 켜지 않음
  const bg = {};
  Object.entries(bgRaw || {}).forEach(([k,v])=>{ const n = BG_KEY_ALIAS[k] || k; if(bg[n] === undefined || n === k) bg[n] = v; });
  const MAP = {
    'background': {el:'layer-background', def:'default-bg'},
    'caustic':  {el:'layer-bg-caustic', def:'default-caustic'},
    'volume':   {el:'layer-bg-volume',  def:null},
    'farobj':   {el:'layer-far-obj',    def:null},
    'nearobj':  {el:'layer-near-obj',   def:null},
    'floor':    {el:'layer-floor-base', def:null},
    'floorobj': {el:'layer-floor-obj',  def:null},
    'shimmer':  {el:'layer-shimmer-img',def:null},
    'frame':    {el:'layer-frame-img',  def:null},
  };
  Object.entries(MAP).forEach(([key, map])=>{
    const el = document.getElementById(map.el);
    if(!el) return;
    const src = fixImageUrl(bg ? bg[key] : null);
    if(src){
      el.src = src;
      el.style.display = 'block';
      if(map.def){ const d=document.getElementById(map.def); if(d) d.style.display='none'; }
      // background 이미지 로드 완료 시 대수조 월드 높이 자동 재계산
      if(key === 'background' && isGrandTank()){
        el.onload = () => recalcGrandWorld();
        if(el.complete && el.naturalWidth) recalcGrandWorld();
      }
    } else {
      el.src = '';
      el.style.display = 'none';
      if(map.def){ const d=document.getElementById(map.def); if(d) d.style.display = (key === 'caustic' && !defaultLight) ? 'none' : 'block'; }
    }
  });
}

function applyFishFromData(fishArr){
  console.log('[AQUIVE] applyFishFromData:', fishArr?.length, fishArr?.[0]?.src);
  FISH.length = 0;
  if(!fishArr || !fishArr.length) return;
  fishArr = fishArr.map(f => ({...f, src: fixImageUrl(f.src)}));
  fishArr.forEach(fd => { FISH.push(...buildInstance(fd)); });
  const layerOrder = {far:0, bot:1, mid:2, near:3};
  FISH.sort((a,b) => (layerOrder[a.layer]||2)-(layerOrder[b.layer]||2));
  const uiTr = document.getElementById('ui-tr');
  if(uiTr) uiTr.textContent = FISH.length + ' specimens';
}

// 나의 수조에 들어갈 물고기: 지금까지 도감에 등록(발견)한 물고기를 종마다 1마리씩.
// 원래 있던 수조의 거리(near/mid/far/bot)·움직임(해파리/두족류)을 그대로 가져옴
function userTankFish(){
  const collected = getCollectedSet(), out = [];
  getAllFishAcrossTanks().forEach(g=>{
    if(g.tank.userTank) return;
    const home = g.tank.id === 9 ? 'jelly' : g.tank.id === 8 ? 'octo' : '';
    g.fish.forEach(f=>{
      if(!collected.has(f.id)) return;
      const lay = Object.keys(fishLayerMap(f))[0] || 'mid';
      out.push({...f, layers:{[lay]:1}, layer:lay, count:1, moveType: f.moveType || home});
    });
  });
  return out;
}

async function applyTankData(tankId){
  const localKey = 'aquive_tank_data';
  let local = {};
  try{ local = JSON.parse(localStorage.getItem(localKey)||'{}'); } catch(e){}
  const localTank  = local[tankId];
  const remoteTank = remoteData ? remoteData[tankId] : null;
  const bg   = localTank?.bg   || remoteTank?.bg   || {};
  let fish = (localTank?.fish?.length) ? localTank.fish : (remoteTank?.fish || []);
  if(getTank(tankId)?.userTank) fish = userTankFish();     // 나의 수조: 발견한 물고기를 1종씩
  const defaultLight = (localTank && localTank.defaultLight !== undefined) ? localTank.defaultLight : remoteTank?.defaultLight;   // false = caustic 이미지가 없어도 기본 빛을 켜지 않음 (없으면 true)
  applyBgFromData(bg, {defaultLight});
  applyFishFromData(fish);
  onTankChanged(tankId);
}

function getTank(id){ return TANKS.find(t=>t.id===id); }

let mapCurrentFloor = '1F';

// tankId(TANKS의 id) 기준으로 어느 층 방인지 찾는다 (인덱스 아님). 대수조(0)는 어느 층에도 속하지 않는 특수 케이스.
function tankFloorOf(tankId){
  if(tankId===0) return null;
  for(const floor of Object.keys(MAP_FLOORS)){
    if(MAP_FLOORS[floor].rooms.some(r=>r.id===tankId)) return floor;
  }
  return null;
}

function mk(tag, cls, styles, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(styles) Object.assign(e.style, styles);
  if(html != null) e.innerHTML = html;
  return e;
}
const pxs = n => n + 'px';
function mkText(cls, styles, text){ const e = mk('div', cls, styles); e.textContent = text; return e; }   // 글자는 HTML로 해석하지 않음

function renderMapFloor(floor){
  mapCurrentFloor = floor;
  const F = MAP_FLOORS[floor];
  const stage = document.getElementById('map-stage');
  if(!F || !stage) return;
  stage.innerHTML = '';
  const curId = TANKS[currentTankIdx].id;

  // 폴더 모양 패널 (활성 탭 위치에 따라 모양이 다름)
  const clip = "path('" + F.panel + "')";
  stage.appendChild(mk('div', '', {left:'430px', top:'118px', width:'1700px', height:'1080px', clipPath:clip, webkitClipPath:clip})).id = 'map-panel';

  // 눌리지 않은 탭 모양
  F.tabs.filter(t=>!t.active).forEach(t=>{
    stage.appendChild(mk('div', 'map-tab-shape', {left:pxs(t.x), top:'118px', width:'300px', height:'80px'},
      '<svg width="300" height="80" viewBox="0 0 300 80" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="'+MAP_TAB_D+'" fill="#343C3F"/></svg>'));
  });

  // 평면도 그림 (방 모양은 그림이고, 눌리는 영역은 아래 투명 버튼)
  const planImg = mk('img', 'map-plan', MAP_PLAN_POS[floor]); planImg.src = MAP_PLAN[floor]; planImg.alt = floor + ' 평면도'; planImg.draggable = false;
  stage.appendChild(planImg);

  // 계단 그림 (평면도에 포함되어 지금은 없음)
  F.decor.forEach(d=> stage.appendChild(mk('div', 'map-decor', {left:pxs(d.x), top:pxs(d.y), width:pxs(d.w), height:pxs(d.h)}, d.html)));

  // 방
  F.rooms.forEach(r=>{
    const tank = getTank(r.id);
    const unlocked = isTankUnlocked(tank);
    const current  = (r.id === curId);
    const btn = mk('button', 'map-room' + (current ? ' current' : '') + (!unlocked ? ' locked' : ''),
      {left:pxs(r.x), top:pxs(r.y), width:pxs(r.w), height:pxs(r.h), borderRadius:(r.r || '0')});
    if(r.clip){ btn.style.clipPath = "path('"+r.clip+"')"; btn.style.webkitClipPath = btn.style.clipPath; }
    btn.type = 'button';
    btn.setAttribute('aria-label', tank.name + (current ? ' (현재 위치)' : !unlocked ? ' (잠김)' : ''));
    btn.addEventListener('click', ()=> selectTankFromMap(r.id));
    stage.appendChild(btn);
  });

  // 층 탭 (글자 + 클릭 영역)
  F.tabs.forEach(t=>{
    const b = mk('button', 'map-tab' + (t.active ? ' active' : ''), {left:pxs(t.cx-150), top:'118px'}, t.floor);
    b.type = 'button';
    b.setAttribute('aria-label', t.floor + ' 지도');
    if(!t.active) b.addEventListener('click', ()=> renderMapFloor(t.floor));
    stage.appendChild(b);
  });
}

function selectTankFromMap(tankId){
  const tank = getTank(tankId);
  if(!isTankUnlocked(tank)){
    showLockToast(tank);
    return;
  }
  closeMap();
  tryNav(TANKS.findIndex(t=>t.id===tankId)); // id → 인덱스 변환
}

function openMap(){
  hidePopup();
  closeDex();
  closeMe();
  closeEnding();
  renderMapFloor(tankFloorOf(TANKS[currentTankIdx].id) || '1F');
  document.getElementById('map-overlay').classList.add('open');
  document.getElementById('map-toggle')?.classList.add('active');   // 오른쪽 '지도' 탭이 하늘색으로
}
function closeMap(){
  document.getElementById('map-overlay')?.classList.remove('open');
  document.getElementById('map-toggle')?.classList.remove('active');
}

// '지도' 탭은 열기/닫기 토글, 패널 바깥(빈 곳)을 눌러도 닫힘
document.getElementById('map-toggle')?.addEventListener('click', ()=>{
  document.getElementById('map-overlay').classList.contains('open') ? closeMap() : openMap();
});
document.getElementById('map-overlay')?.addEventListener('click', (e)=>{
  if(e.target.id === 'map-overlay') closeMap();
});

//  생물 도감 (Specimen Codex)
// ══════════════════════════════════════════
const DEX_KEY = 'aquive_collected_fish';

function getCollectedSet(){
  try{
    const arr = JSON.parse(localStorage.getItem(DEX_KEY) || '[]');
    return new Set(arr);
  } catch(e){ return new Set(); }
}
function saveCollectedSet(set){
  try{ localStorage.setItem(DEX_KEY, JSON.stringify(Array.from(set))); } catch(e){}
}

function recordSighting(fishId){
  if(fishId===undefined || fishId===null) return;
  const set = getCollectedSet();
  const had = set.has(fishId);
  set.add(fishId);
  saveCollectedSet(set);
  if(!had){
    window.AquiveSync?.push();   // 계정 기록 저장
    updateDexBadge();
    if(document.getElementById('dex-overlay')?.classList.contains('open')){
      renderDex();
    }
  }
}

// 전체 수조의 물고기 데이터를 한 번에 모음 (remoteData + localStorage 병합, applyTankData와 동일한 우선순위)
function getAllFishAcrossTanks(){
  const localKey = 'aquive_tank_data';
  let local = {};
  try{ local = JSON.parse(localStorage.getItem(localKey)||'{}'); } catch(e){}

  const groups = [];
  TANKS.forEach(tank=>{
    const localTank  = local[tank.id];
    const remoteTank  = remoteData ? remoteData[tank.id] : null;
    const fishArr = (localTank?.fish?.length) ? localTank.fish : (remoteTank?.fish || []);
    groups.push({
      tank,
      fish: fishArr.map(f => ({...f, src: fixImageUrl(f.src)})),
    });
  });
  return groups;
}

function updateDexBadge(){
  const badge = document.getElementById('dex-badge');
  if(!badge) return;
  const groups = getAllFishAcrossTanks();
  const totalFish = groups.reduce((sum,g)=> sum + g.fish.length, 0);
  const collected = getCollectedSet();
  const foundCount = groups.reduce((sum,g)=> sum + g.fish.filter(f=>collected.has(f.id)).length, 0);
  if(totalFish === 0){
    badge.style.display = 'none';
    return;
  }
  badge.style.display = 'flex';
  badge.textContent = foundCount;
}

function maskName(name){
  // 미발견 종의 이름을 자모 단위로 가려서 '???' 식으로 표시
  return name.replace(/./g, '?');
}

// ══════════════════════════════════════════
//  도감 화면 (Figma 도감 / 도감2)
//  · 책갈피 = 수조 1개. 양쪽에 반씩(12개면 왼쪽 6 · 오른쪽 6) 배치 → 모든 수조가 들어감
//  · 지금 보는 수조의 책갈피만 페이지와 하나의 모양으로 이어져 있다 (지도의 활성 탭과 같은 방식). 나머지는 떨어져 있음
//  · 한 페이지 6마리(2×3). 첫 화면 = 표지 + 1페이지, 이후 두 페이지씩 넘김
// ══════════════════════════════════════════
const DEX_PER_PAGE = 6;
let dexTank = 0, dexSpread = 0;            // dexTank = TANKS 배열의 인덱스
const DEX_TAB_W = 40, DEX_TAB_R = 25, DEX_TAB_FILLET = 14;   // 책갈피가 페이지 밖으로 나온 폭 / 바깥 모서리 / 페이지와 만나는 오목 모서리

const DEX_P_L = 'M772.71 0C778.915 0 784.481 3.82091 786.71 9.6123L807.632 63.9785C811.346 73.631 820.621 80 830.964 80H900V1212H15C6.71573 1212 0 1205.28 0 1197V95C4.12325e-06 86.7157 6.71573 80 15 80H488.763C499.105 80 508.38 73.631 512.095 63.9785L533.017 9.6123C535.245 3.82106 540.81 0.000150332 547.016 0H772.71Z';
const DEX_P_R = 'M127.29 0C121.085 0 115.519 3.82091 113.29 9.6123L92.3682 63.9785C88.6536 73.631 79.3787 80 69.0361 80H0V1212H885C893.284 1212 900 1205.28 900 1197V95C900 86.7157 893.284 80 885 80H411.237C400.895 80 391.62 73.631 387.905 63.9785L366.983 9.6123C364.755 3.82106 359.19 0.000150332 352.984 0H127.29Z';
const DEX_P_COVER = 'M900 0V1132H15C6.71573 1132 2.44818e-06 1125.28 0 1117V15C1.69128e-07 6.71573 6.71573 0 15 0H900Z';
const DEX_ARR_PREV = 'M1.78873e-07 12.9902L22.5 -0.000146598L22.5 25.9806L1.78873e-07 12.9902Z';
const DEX_ARR_NEXT = 'M22.5 12.9902L-1.2235e-06 25.9806L-8.78432e-08 -0.000147849L22.5 12.9902Z';
const DEX_LOCK = 'M33.3887 0.00488281C41.4938 0.210486 48.001 6.84533 48.001 15V24.2998C54.8472 25.69 60 31.7435 60 39V51C59.9999 59.2841 53.2841 65.9999 45 66H15C6.71582 66 0.000146962 59.2841 0 51V39C0 31.7428 5.15379 25.6893 12.001 24.2998V15C12.001 6.84537 18.5082 0.210548 26.6133 0.00488281L27.001 0H33.001L33.3887 0.00488281ZM27.001 9C23.6873 9.00004 21.001 11.6863 21.001 15V24H39.001V15C39.001 11.6863 36.3147 9 33.001 9H27.001Z';

// SVG 경로(M L H V C A Z)의 x 좌표를 dx만큼 이동
function dexShiftPath(d, dx){
  return d.replace(/([MLHVCAZ])([^MLHVCAZ]*)/g, (_, cmd, args)=>{
    const nums = (args.match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi) || []).map(Number);
    if(cmd==='Z') return 'Z';
    let out = nums.slice();
    if(cmd==='H') out[0] += dx;
    else if(cmd==='V') {}
    else if(cmd==='A'){ for(let i=0;i<out.length;i+=7) out[i+5] += dx; }
    else { for(let i=0;i<out.length;i+=2) out[i] += dx; }   // M L C
    return cmd + out.join(' ');
  });
}

// 페이지 가장자리(왼쪽 x=0 / 오른쪽 x=900)에서 y1~y1+100 구간을 바깥으로 튀어나오게 하는 경로 조각
function dexBulge(side, y1){
  const y2 = y1+100, W=DEX_TAB_W, R=DEX_TAB_R, r=DEX_TAB_FILLET;
  if(side==='left'){
    return 'V'+(y2+r)+'A'+r+' '+r+' 0 0 0 '+(-r)+' '+y2+'H'+(-(W-R))+'A'+R+' '+R+' 0 0 1 '+(-W)+' '+(y2-R)+
           'V'+(y1+R)+'A'+R+' '+R+' 0 0 1 '+(-(W-R))+' '+y1+'H'+(-r)+'A'+r+' '+r+' 0 0 0 0 '+(y1-r);
  }
  const X=900;
  return 'V'+(y2+r)+'A'+r+' '+r+' 0 0 1 '+(X+r)+' '+y2+'H'+(X+W-R)+'A'+R+' '+R+' 0 0 0 '+(X+W)+' '+(y2-R)+
         'V'+(y1+R)+'A'+R+' '+R+' 0 0 0 '+(X+W-R)+' '+y1+'H'+(X+r)+'A'+r+' '+r+' 0 0 1 '+X+' '+(y1-r);
}

// kind: 'L'(왼쪽 안쪽 페이지) 'C'(표지) 'R'(오른쪽 페이지). bulge = {side, tabTop} 이면 그 높이에 책갈피를 합침
function dexPagePath(kind, bulge, pageTop){
  const base   = kind==='L' ? DEX_P_L : kind==='C' ? DEX_P_COVER : DEX_P_R;
  const marker = kind==='L' ? 'V95C4.12325e-06' : kind==='C' ? 'V15C1.69128e-07' : 'V95C900 86.7157';
  let d = base;
  if(bulge){
    d = d.replace(marker, dexBulge(bulge.side, bulge.tabTop - pageTop) + marker);
  }
  return dexShiftPath(d, kind==='R' ? 0 : 100);     // 왼쪽 페이지들은 튀어나온 만큼 100px 여백을 둔 상자에 그림
}

function dexTabSide(i){ return i < Math.ceil(TANKS.length/2) ? 'left' : 'right'; }
function dexTabRow(i){ const half = Math.ceil(TANKS.length/2); return i < half ? i : i-half; }
function dexTabTop(row){ return 197.5 + 115*row; }

let dexGroupsNow = null;      // 지금 화면에 놓인 왼쪽/오른쪽 페이지 묶음 {L, R}
let dexFlipFinish = null;     // 넘김 애니메이션이 진행 중이면 즉시 마무리하는 함수
const dexReduceMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const dexGrp = () => mk('div','dex-grp');

// 열거나 수조를 바꿀 때: 카드·글자가 아래에서 살짝 올라오며 차례로 나타남
function dexIntro(root){
  root.querySelectorAll('.dex-card,.dex-pgnum,.dex-pgbtn,.dex-cover-title,.dex-cover-sub,.dex-empty').forEach((el,i)=>{
    el.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'translateY(0)'}],
               {duration:320,delay:Math.min(i,12)*35,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});
  });
}

// 페이지 넘김: 책장(leaf)이 책등(x=1280)을 축으로 180° 회전. dir='next'면 오른쪽 페이지가 왼쪽으로, 'prev'면 왼쪽 페이지가 오른쪽으로
//  · 앞면 = 넘어가는 옛 페이지, 뒷면 = 새로 펼쳐질 반대편 페이지. 책장 아래에는 새 페이지와 옛 페이지가 놓여 있다가, 끝나면 최종 화면으로 교체
function dexFlip(stage, dir, prev, gL, gR, rings){
  const leaf = mk('div','dex-leaf'), f1 = mk('div','dex-face'), f2 = mk('div','dex-face dex-face-back');
  const shadeAt = x => ({left:pxs(x), top:'68px', width:'900px', height:'1212px'});
  const sh1 = mk('div','dex-shade', shadeAt(dir==='next' ? 1280 : 380));
  const sh2 = mk('div','dex-shade', shadeAt(dir==='next' ? 380 : 1280));
  if(dir === 'next'){ prev.L.classList.add('dex-old'); stage.append(prev.L, gR); f1.append(prev.R); f2.append(gL.cloneNode(true)); }
  else              { prev.R.classList.add('dex-old'); stage.append(gL, prev.R); f1.append(prev.L); f2.append(gR.cloneNode(true)); }
  f1.append(sh1); f2.append(sh2); leaf.append(f1, f2);
  stage.append(leaf); rings.forEach(r => stage.append(r));          // 링은 책장 위에

  const angle = dir === 'next' ? -180 : 180;
  const anim = leaf.animate([{transform:'rotateY(0deg)'},{transform:'rotateY('+angle+'deg)'}],
                            {duration:680, easing:'cubic-bezier(.5,.05,.25,1)', fill:'forwards'});
  sh1.animate([{opacity:0},{opacity:.22}], {duration:340, easing:'ease-in',  fill:'forwards'});     // 넘어가며 살짝 어두워졌다가
  sh2.animate([{opacity:.22},{opacity:0}], {duration:340, delay:340, easing:'ease-out', fill:'both'}); // 내려앉으며 밝아짐

  const done = ()=>{
    if(dexFlipFinish !== done) return;
    dexFlipFinish = null; anim.cancel(); leaf.remove();
    if(dir === 'next'){ prev.L.remove(); stage.insertBefore(gL, gR); }
    else              { prev.R.remove(); gL.after(gR); }
  };
  dexFlipFinish = done; anim.onfinish = done;
}

// mode: 'open'(열기) | 'swap'(다른 수조 책갈피) | 'next' | 'prev'(페이지 넘김) | 없음(즉시 다시 그리기)
function renderDex(mode){
  const stage = document.getElementById('dex-stage');
  if(!stage) return;
  if(dexFlipFinish) dexFlipFinish();                     // 진행 중이던 넘김은 즉시 마무리
  const all = getAllFishAcrossTanks();
  const collected = getCollectedSet();
  const tank = TANKS[dexTank];

  // 이 수조의 물고기 → 페이지로 나눔
  const list = [];
  const g0 = all.find(x=>x.tank.id===tank.id);
  if(g0) g0.fish.forEach(f=> list.push({fd:f, tank:g0.tank}));
  const pages = [];
  for(let i=0;i<list.length;i+=DEX_PER_PAGE) pages.push(list.slice(i,i+DEX_PER_PAGE));
  if(!pages.length) pages.push([]);
  const total = pages.length;
  const spreads = 1 + Math.ceil((total-1)/2);
  dexSpread = Math.max(0, Math.min(spreads-1, dexSpread));
  const cover = (dexSpread === 0);
  const leftNo  = cover ? 0 : 2*dexSpread;          // 0 = 표지
  const rightNo = cover ? 1 : 2*dexSpread + 1;
  const hasRight = rightNo <= total;
  const prevOff = (dexSpread === 0), nextOff = (dexSpread >= spreads-1);

  const prev = dexGroupsNow;                         // 넘김 애니메이션에 쓸 이전 화면
  stage.innerHTML = '';

  // 1) 떨어져 있는 책갈피 (현재 수조 것은 페이지와 합쳐서 그리므로 제외) — 페이지 뒤에 깔림
  TANKS.forEach((tk,i)=>{
    if(i === dexTank) return;
    const side = dexTabSide(i), locked = !isTankUnlocked(tk);
    const b = mk('button', 'dex-tab '+side+(locked?' locked':''),
      {left: side==='left' ? '340px' : '2171px', top: pxs(dexTabTop(dexTabRow(i)))});
    b.type = 'button';
    b.title = tk.name + (locked ? ' (잠김)' : '');
    b.setAttribute('aria-label', tk.name + (locked ? ' (잠김)' : ''));
    b.addEventListener('click', ()=>{
      if(locked){ showLockToast(tk); return; }
      dexTank = i; dexSpread = 0; renderDex('swap');
    });
    stage.appendChild(b);
  });

  // 2) 왼쪽/오른쪽 페이지 묶음 (현재 수조의 책갈피가 있는 쪽 페이지에 책갈피를 합침)
  const gL = dexGrp(), gR = dexGrp();
  const cur = {side: dexTabSide(dexTank), tabTop: dexTabTop(dexTabRow(dexTank))};
  const bl = (cur.side==='left')  ? cur : null;
  const br = (cur.side==='right') ? cur : null;
  if(cover){
    const clip = "path('"+dexPagePath('C', bl, 148)+"')";     // 반투명 표지: 책갈피도 같은 반투명으로 이어짐
    gL.appendChild(mk('div','dex-page dex-page-cover',{left:'280px',top:'148px',width:'1000px',height:'1132px',clipPath:clip,webkitClipPath:clip}));
  } else {
    gL.appendChild(mk('div','dex-page',{left:'280px',top:'68px',width:'1000px',height:'1212px'},
      '<svg width="1000" height="1212" viewBox="0 0 1000 1212" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="'+dexPagePath('L', bl, 68)+'"/></svg>'));
  }
  gR.appendChild(mk('div','dex-page',{left:'1280px',top:'68px',width:'1000px',height:'1212px'},
    '<svg width="1000" height="1212" viewBox="0 0 1000 1212" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="'+dexPagePath('R', br, 68)+'"/></svg>'));

  // 3) 링 (책 가운데)
  const rings = (cover ? [193,713,1233] : [190,710,1230]).map(y=> mk('div','dex-ring',{left:'1230px',top:pxs(y)}));

  // 4) 표지 (첫 화면 왼쪽): Collect / 전체 발견 수 / 이 수조 정보
  if(cover){
    let totalFound = 0;
    all.forEach(g=> g.fish.forEach(f=>{ if(collected.has(f.id)) totalFound++; }));
    const inTank = list.filter(x=>collected.has(x.fd.id)).length;
    gL.appendChild(mk('div','dex-font dex-cover-title',{left:'480px',top:'248px'},'Collect'));
    gL.appendChild(mk('div','dex-font dex-cover-sub',{left:'501px',top:'347px'}, String(totalFound).padStart(4,'0')+' species'));
    gL.appendChild(mkText('dex-font dex-cover-sub',{left:'501px',top:'430px'}, tank.name));
    gL.appendChild(mkText('dex-font dex-cover-sub',{left:'501px',top:'478px'}, '발견 '+inTank+' / '+list.length));
  }

  // 5) 물고기 카드 (페이지당 2열×3행)
  const ROWS = [248,560,872];
  const drawPage = (grp, no, cols)=>{
    const items = pages[no-1] || [];
    if(no === 1 && !items.length){
      grp.appendChild(mk('div','dex-font dex-empty',{left:pxs(cols[0]),top:'520px'},'아직 등록된 생물이 없어요'));
      return;
    }
    items.forEach((it,i)=>{
      const fd = it.fd, found = collected.has(fd.id);
      const card = mk('button','dex-card '+(found?'found':'unfound'),{left:pxs(cols[i%2]),top:pxs(ROWS[Math.floor(i/2)])});
      card.type = 'button';
      card.setAttribute('aria-label', found ? fd.name : '미발견 개체');
      const box = mk('div','dex-thumb-box');
      const img = document.createElement('img');
      img.className = 'dex-thumb'; img.src = fd.src; img.alt = found ? fd.name : ''; img.loading = 'lazy';
      box.appendChild(img);
      card.appendChild(box);
      card.appendChild(mkText('dex-font dex-name',null, found ? fd.name : maskName(fd.name)));
      if(found) card.appendChild(mkText('dex-font dex-latin',null, fd.latin || ''));
      if(found) card.addEventListener('click', ()=> showDexDetail(fd, it.tank));
      grp.appendChild(card);
    });
  };
  const pager = (grp, no, prevX, numCx, nextX)=>{
    grp.appendChild(mk('div','dex-font dex-pgnum',{left:pxs(numCx-50),top:'1213px'}, no+'/'+total));
    const step = (d)=>()=>{ dexSpread += d; renderDex(d > 0 ? 'next' : 'prev'); };
    const pb = mk('button','dex-pgbtn',{left:pxs(prevX+11.5-30),top:pxs(1232-30)},
      '<svg width="23" height="26" viewBox="0 0 23 26" fill="none" style="left:18px;top:17px"><path d="'+DEX_ARR_PREV+'" fill="'+(prevOff?'#D9D9D9':'#343C3F')+'"/></svg>');
    pb.type='button'; pb.disabled = prevOff; pb.setAttribute('aria-label','이전 페이지'); pb.addEventListener('click', step(-1));
    const nb = mk('button','dex-pgbtn',{left:pxs(nextX+19-30),top:pxs(1228-30)},
      '<svg width="23" height="26" viewBox="0 0 23 26" fill="none" style="left:18px;top:17px"><path d="'+DEX_ARR_NEXT+'" fill="'+(nextOff?'#D9D9D9':'#343C3F')+'"/></svg>');
    nb.type='button'; nb.disabled = nextOff; nb.setAttribute('aria-label','다음 페이지'); nb.addEventListener('click', step(1));
    grp.appendChild(pb); grp.appendChild(nb);
  };
  if(!cover){ drawPage(gL, leftNo, [415,825]); pager(gL, leftNo, 750, 830, 880); }
  if(hasRight){ drawPage(gR, rightNo, [1356,1766]); pager(gR, rightNo, 1650, 1730, 1780); }

  // 6) 화면에 올리기: 페이지 넘김이면 책장 회전, 아니면 바로 (열기·수조 변경은 카드가 차례로 나타남)
  dexGroupsNow = {L:gL, R:gR};
  if((mode === 'next' || mode === 'prev') && prev && !dexReduceMotion()){
    dexFlip(stage, mode, prev, gL, gR, rings);
    return;
  }
  stage.append(gL, gR);
  rings.forEach(r => stage.append(r));
  if((mode === 'open' || mode === 'swap') && !dexReduceMotion()) dexIntro(stage);
}

function showDexDetail(fd, tank){
  fillPopup(fd);
  placePopup(null, null);   // 도감에서는 화면 중앙에 (기록은 이미 발견된 종)
}

//  인물 (Figma 인물): 바인더 + 꺼내 놓은 ID card. 오른쪽 사람 탭으로 열고 닫는다
//  · 로그인한 계정의 이름·수심·도감·프로필 이미지를 보여준다 (프로필 칸을 누르면 그림 선택)

// 검은 표지 카드의 희미한 물고기 (진입화면에서 본 물고기와 같은 종)
function meFishData(){
  if(meFishMemo) return meFishMemo;
  let fi = parseInt(localStorage.getItem('aquive_last_fish')); if(!(fi >= 0 && fi < ME_FISH.length)) fi = 0;
  const fish = ME_FISH[fi], n = fish.n, bin = atob(fish.b64), u8 = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  const dv = new DataView(u8.buffer), FD = new Float32Array(n*6);
  for(let i=0;i<n;i++){
    for(let k=0;k<3;k++) FD[i*6+k] = dv.getInt16((i*3+k)*2, true)/10000;
    const nx=dv.getInt8(n*6+i*3), ny=dv.getInt8(n*6+i*3+1), nz=dv.getInt8(n*6+i*3+2), l=Math.hypot(nx,ny,nz)||1;

  }
  return meFishMemo = {FD, n, caption: fish.latin ? fish.latin+'  ·  '+fish.common : fish.common};
}

  const D='0123456789', rc=()=>D[Math.floor(Math.random()*10)], ri=(a,b)=>Math.floor(Math.random()*(b-a))+a, cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const chars = Array.from({length:N}, rc), tm = new Uint8Array(N), iv = Array.from({length:N}, ()=>ri(18,55));
  const LX=-0.4, LY=0.5, LZ=0.7, LL=Math.sqrt(LX*LX+LY*LY+LZ*LZ);
  const FONTS=[]; for(let s=5;s<=12;s++) FONTS[s]='bold '+(s*K).toFixed(1)+"px 'Courier New',monospace";
  const sx=new Float32Array(N), sy=new Float32Array(N), sz=new Float32Array(N), lt=new Float32Array(N), rm=new Float32Array(N);
  const order = Array.from({length:N}, (_,i)=>i);
  (function frame(){
    if(!meIsOpen()) return;                       // 닫혀 있으면 멈춤
    ctx.setTransform(u*dpr,0,0,u*dpr,0,0); ctx.clearRect(0,0,CW,CH);
    for(let i=0;i<N;i++){ tm[i]++; if(tm[i]>=iv[i]){ tm[i]=0; chars[i]=rc(); iv[i]=ri(18,55); } }
    for(let i=0;i<N;i++){
      const o=i*6, px=FD[o], py=FD[o+1], pz=FD[o+2], nx=FD[o+3], ny=FD[o+4], nz=FD[o+5];
      lt[i]=cl((nx*LX+ny*LY+nz*LZ)/LL,0.05,1); rm[i]=Math.pow(1-Math.abs(nz),3);
      sx[i]=CX+px*S; sy[i]=CY-py*S; sz[i]=pz;
    }
    order.sort((a,b)=>sz[a]-sz[b]);
    ctx.textBaseline='middle'; ctx.textAlign='center';
    for(let n=0;n<N;n++){
      const i=order[n], l=lt[i], rim=rm[i], spec=Math.max(0,l-0.6)*2.5, br=0.45+rim*0.55;
      ctx.font=FONTS[cl(Math.round(5+br*7),5,12)];
      ctx.fillStyle='rgba('+cl(Math.round(60+rim*180+spec*80),0,255)+','+cl(Math.round(140+rim*100+l*60+spec*30),0,255)+',255,'+cl(0.35+br*0.65,0,1)+')';
      ctx.fillText(chars[i], sx[i], sy[i]);
    }
    ctx.font="6px 'Courier New',monospace"; ctx.fillStyle='rgba(100,190,255,0.35)'; ctx.fillText(d.caption.toUpperCase(), CW/2, CH-8);
    meFishRaf = requestAnimationFrame(frame);
  })();
}

//  전시 모드 (?mode=exhibit)

// ══════════════════════════════════════════
const END_TANK_ID = 12;                                   // 마지막 수조(멸종보관소)
let hudDepthShown = 0, hudDepthRaf = 0;
function setHudDepth(n){                                  // 수심 숫자가 이전 값에서 새 값으로 부드럽게 바뀜
  const el = document.getElementById('ui-depth'); if(!el) return;
  cancelAnimationFrame(hudDepthRaf);
  const from = hudDepthShown, t0 = performance.now(), dur = 700;
  const step = now => {
    const k = Math.min(1, (now-t0)/dur), e = 1 - Math.pow(1-k, 3);
    hudDepthShown = Math.round(from + (n-from)*e);
    el.textContent = hudDepthShown.toLocaleString();
    if(k < 1) hudDepthRaf = requestAnimationFrame(step);
  };
  hudDepthRaf = requestAnimationFrame(step);
}

const endIsOpen = () => !!document.getElementById('end-overlay')?.classList.contains('open');
function goStart(){ AquiveExhibit.resetSession(); location.href = AquiveExhibit.INDEX_URL; }   // 관람 끝: 기록을 지우고 처음 화면으로

const END_ROW_H = 149, END_COL_LEFT = [121, 521, 921, 1321];   // 줄 간격 / 4열 각 칸(폭 400)의 왼쪽 (패널 안 좌표, 칸 가운데 = 스테이지 x 680·1080·1480·1880)
const END_FIRST_TOP = 438, END_VP_BOTTOM = 1130, END_BOTTOM_LINE = 1045;   // 첫 줄 위치 / 크레딧 영역 아래끝 / 마지막 글이 멈추는 아래 기준선 (스테이지 y)
function endStop(){ cancelAnimationFrame(endRaf); endRaf = 0; }

// 엔딩 크레딧: 닉네임 명단이 아래에서 위로 자동으로 올라가고, 끝에 감사 메시지 + 링크. 마우스 휠로 직접 움직일 수도 있음(잠시 멈췄다가 이어서 흐름)
function openEnding(){
  if(!EX || endIsOpen()) return;
  hidePopup(); closeMap(); closeDex(); closeMe();
  const stage = document.getElementById('end-stage'); stage.innerHTML = '';
  const names = AquiveExhibit.names(), meT = AquiveExhibit.me(), link = AquiveExhibit.LINK;
  const meEntry = names.find(e => e.t === meT), meName = meEntry ? meEntry.n : '연구원';
  const panel = mk('div','end-panel',{left:'359px',top:'170px',width:'1842px',height:'1105px'});
  stage.appendChild(panel);
  panel.appendChild(mk('div','end-t',{left:'703px',top:'101px',width:'436px',fontSize:'40px',textAlign:'center'},'조사를 끝낸 연구원들'));

  const vp = mk('div','end-vp',{left:'0',top:'210px',width:'1842px',height:'750px'}); panel.appendChild(vp);
  const track = mk('div','end-track',{left:'0',top:(END_FIRST_TOP-380)+'px',width:'1842px'}); vp.appendChild(track);
  const rows = Math.max(1, Math.ceil(names.length/4)), lastTop = (rows-1)*END_ROW_H;
  names.forEach((e,i)=> track.appendChild(mkText('end-t end-name'+(e.t === meT ? ' me' : ''),
    {left:END_COL_LEFT[i%4]+'px', top:(Math.floor(i/4)*END_ROW_H)+'px'}, e.n)));
  const msg = (dy, txt, cls)=> track.appendChild(mkText('end-t end-msg'+(cls ? ' '+cls : ''), {top:(lastTop+dy)+'px'}, txt));
  msg(183, '조사에 참여해주셔서 감사합니다.');
  msg(321, meName + ' 님', 'me');
  if(link){ msg(459, '이후는 아래 링크에서 즐기실 수 있습니다.'); msg(597, link); }
  const contentH = lastTop + (link ? 597 : 321) + 38;

  const btn = mk('button','end-btn',{left:'771px',top:'975px'},'처음으로'); btn.type='button'; btn.addEventListener('click', goStart); panel.appendChild(btn);

  // 스크롤: off = 0 이면 첫 줄이 시안 첫 화면 위치, off = maxOff 이면 마지막 글이 시안 끝 화면 위치
  const startOff = -(END_VP_BOTTOM - END_FIRST_TOP), maxOff = Math.max(0, END_FIRST_TOP + contentH - END_BOTTOM_LINE);
  const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  let off = reduce ? maxOff : startOff, pausedUntil = 0, lastT = performance.now(), lastTouch = 0;
  const speed = Math.max(90, (maxOff - startOff) / 90);            // 초당 이동 거리(디자인 px): 기본 90, 명단이 아주 길면 90초 안에 끝나도록 빠르게
  const apply = ()=>{ track.style.transform = 'translateY(' + (-off) + 'px)'; };
  apply();
  const tick = now => {
    const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
    if(now >= pausedUntil && off < maxOff){ off = Math.min(maxOff, off + speed*dt); apply(); }
    if((off < maxOff || now < pausedUntil) && now - lastTouch > 1000){ AquiveExhibit.touch(); lastTouch = now; }   // 크레딧이 흐르는 동안은 자동 복귀 타이머를 늦춤
    endRaf = requestAnimationFrame(tick);
  };
  endRaf = requestAnimationFrame(tick);
  // 마우스 휠/트랙패드: 패널 어디서든 크레딧이 움직임 (뒤의 수조는 움직이지 않음). 직접 움직이면 4초 멈췄다가 이어서 흐름
  panel.addEventListener('wheel', e=>{
    if(e.ctrlKey) return;
    e.preventDefault(); e.stopPropagation();
    const u = popScale(), px = e.deltaMode === 1 ? e.deltaY*40 : e.deltaMode === 2 ? e.deltaY*600*u : e.deltaY;
    off = Math.max(startOff, Math.min(maxOff, off + px/u)); apply();
    pausedUntil = performance.now() + 4000;
  }, {passive:false});
  window.__end = { startOff, maxOff, get off(){ return off; }, setOff(v){ off = v; apply(); pausedUntil = performance.now() + 60000; } };   // 확인용 (화면 동작에는 영향 없음)

  document.getElementById('end-overlay').classList.add('open');
}
